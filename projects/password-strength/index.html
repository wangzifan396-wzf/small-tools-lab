<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Password Strength · 密码强度</title>
<style>
  :root { --bg:#f7f8fa; --card:#fff; --border:#e3e6eb; --text:#1f2430; --muted:#6b7280; --accent:#24735c; }
  * { box-sizing: border-box; }
  body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
  .wrap { max-width:640px; margin:40px auto; padding:0 18px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 22px; }
  .card { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.04); }
  label { font-size:12px; color:var(--muted); display:block; margin-bottom:4px; }
  input[type=password], input[type=text] { font:15px/1.4 system-ui; padding:9px 11px; border:1px solid var(--border); border-radius:9px; background:#fff; color:var(--text); width:100%; }
  .meter { height:12px; border-radius:7px; background:#eee; overflow:hidden; margin:14px 0 6px; }
  .meter > span { display:block; height:100%; width:0; transition:width .15s, background .15s; }
  .scoreline { font-weight:600; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:6px 18px; margin-top:14px; }
  .item { display:flex; gap:8px; align-items:center; font-size:14px; }
  .dot { width:10px; height:10px; border-radius:50%; background:#cbd2da; }
  .dot.on { background:var(--accent); }
  .dot.bad { background:#d9534f; }
  .meta { color:var(--muted); font-size:13px; margin-top:6px; }
  .suggest { margin:14px 0 0; padding-left:18px; color:#b45309; font-size:14px; }
  .hint { color:var(--muted); font-size:12.5px; margin-top:12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Password Strength · 密码强度</h1>
  <p class="sub">零依赖 · 基于熵的密码强度分析（弱=红，强=绿）</p>
  <div class="card">
    <label>密码</label>
    <input id="pw" type="password" value="Tr0ub4dour&9" />
    <div class="meter"><span id="bar"></span></div>
    <div class="scoreline" id="score">—</div>
    <div class="meta" id="meta"></div>
    <div class="grid" id="checks"></div>
    <ul class="suggest" id="suggest"></ul>
    <p class="hint">估算假设离线破解速度 1e10 次/秒。熵 = 长度 × log2(字符池)。</p>
  </div>
</div>

<script>
// ---- inlined core (mirror of src/core/strength.js; works over file://) ----
const COMMON=['password','123456','12345678','123456789','qwerty','abc123','letmein','welcome','admin','iloveyou','monkey','dragon','sunshine','princess','football','baseball','master','hello','free','shadow','superman','batman','trustno1','whatever','azerty','111111','000000','passw0rd','p@ssword','charlie','donald','access','login','secret'];
const ATTACK_RATE=1e10;
function detectSequential(pw){ const s=pw.toLowerCase(); if(s.length<3)return false; for(let i=0;i+2<s.length;i++){ if(s[i]===s[i+1]&&s[i]===s[i+2])return true; } for(let i=0;i+2<s.length;i++){ const a=s.charCodeAt(i),b=s.charCodeAt(i+1),c=s.charCodeAt(i+2); if(b===a+1&&c===b+1)return true; if(b===a-1&&c===b-1)return true; } return false; }
function detectCommon(pw){ const s=pw.toLowerCase(); if(COMMON.includes(s))return true; const rev=[...s].reverse().join(''); if(COMMON.includes(rev))return true; return false; }
function estimateCrack(bits){ const g=Math.pow(2,bits)/2; const secs=g/ATTACK_RATE; if(secs<1)return '~instant'; if(secs<60)return '~seconds'; if(secs<3600)return '~minutes'; if(secs<86400)return '~hours'; if(secs<86400*365)return '~days'; if(secs<86400*365*100)return '~years'; return '~centuries'; }
function analyze(password=''){
  const length=password.length;
  const hasLower=/[a-z]/.test(password);
  const hasUpper=/[A-Z]/.test(password);
  const hasDigit=/\d/.test(password);
  const hasSymbol=/[^A-Za-z0-9]/.test(password);
  const hasSequential=detectSequential(password);
  const hasRepeats=/(.)\1\1/.test(password);
  const hasCommonPattern=detectCommon(password);
  const tooShort=length<8;
  const allSameClass=[hasLower,hasUpper,hasDigit,hasSymbol].filter(Boolean).length<=1;
  let pool=0; if(hasLower)pool+=26; if(hasUpper)pool+=26; if(hasDigit)pool+=10; if(hasSymbol)pool+=32;
  const entropyBits=pool>0?length*Math.log2(pool):0;
  let score; if(entropyBits<28)score=0; else if(entropyBits<36)score=1; else if(entropyBits<60)score=2; else if(entropyBits<128)score=3; else score=4;
  const crackEstimate=estimateCrack(entropyBits);
  const suggestions=[]; if(length===0)suggestions.push('请输入密码'); else { if(tooShort)suggestions.push('使用至少 8 个字符'); if(!hasLower)suggestions.push('加入小写字母'); if(!hasUpper)suggestions.push('加入大写字母'); if(!hasDigit)suggestions.push('加入数字'); if(!hasSymbol)suggestions.push('加入符号（如 !@#$%）'); if(hasSequential)suggestions.push('避免使用连续序列（如 123、abc）'); if(hasRepeats)suggestions.push('避免重复字符（如 aaa、111）'); if(hasCommonPattern)suggestions.push('避免使用常见密码或单词'); if(allSameClass)suggestions.push('混合多种字符类型以提高强度'); if(suggestions.length===0)suggestions.push('很强，继续保持！'); }
  return { score, entropyBits:Math.round(entropyBits*10)/10, crackEstimate, timeToCrack:crackEstimate, length, flags:{tooShort,hasLower,hasUpper,hasDigit,hasSymbol,hasSequential,hasRepeats,hasCommonPattern,allSameClass}, suggestions };
}

// ---- UI wiring ----
const SCORE_LABEL=['非常弱','弱','中等','强','非常强'];
// Chinese convention: weak=red, strong=green
const COLORS=['#d9534f','#e8783c','#e0b400','#7cb342','#2e9e5b'];
const $=(id)=>document.getElementById(id);
function update(){
  const r=analyze($('pw').value);
  const bar=$('bar'); bar.style.width=((r.score+1)/5*100)+'%'; bar.style.background=COLORS[r.score];
  $('score').textContent=`强度: ${r.score}/4（${SCORE_LABEL[r.score]}）`;
  $('score').style.color=COLORS[r.score];
  $('meta').textContent=`熵 ${r.entropyBits} bits · 破解估算 ${r.crackEstimate} · 长度 ${r.length}`;
  const f=r.flags;
  const items=[
    ['长度 ≥ 8', !f.tooShort, f.tooShort],
    ['小写字母', f.hasLower, false],
    ['大写字母', f.hasUpper, false],
    ['数字', f.hasDigit, false],
    ['符号', f.hasSymbol, false],
    ['无连续序列', !f.hasSequential, f.hasSequential],
    ['无重复字符', !f.hasRepeats, f.hasRepeats],
    ['非常见密码', !f.hasCommonPattern, f.hasCommonPattern],
    ['混合字符类', !f.allSameClass, f.allSameClass],
  ];
  $('checks').innerHTML=items.map(([label,ok,bad])=>`<div class="item"><span class="dot ${ok?'on':(bad?'bad':'')}"></span>${label}</div>`).join('');
  $('suggest').innerHTML=r.suggestions.map(s=>`<li>${s}</li>`).join('');
}
$('pw').addEventListener('input',update);
update();
</script>
</body>
</html>
