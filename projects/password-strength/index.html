<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Password Strength · 密码强度</title>
  <style>
    :root { --bg:#f4f6f7; --surface:#fff; --border:#d8dee2; --text:#17201d; --muted:#60706a; --accent:#176b52; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    .wrap { width:min(700px,calc(100% - 36px)); margin:36px auto; }
    h1 { margin:0; font-size:24px; }
    .sub { margin:4px 0 22px; color:var(--muted); }
    .tool { padding:20px; border:1px solid var(--border); border-radius:8px; background:var(--surface); box-shadow:0 1px 3px rgb(0 0 0 / 5%); }
    label { display:block; margin-bottom:5px; color:var(--muted); font-size:12px; }
    .password-row { display:flex; gap:10px; align-items:end; }
    input[type=password],input[type=text] { flex:1; min-width:0; height:40px; padding:0 10px; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--text); font:15px system-ui; }
    .show { display:flex; align-items:center; gap:6px; height:40px; white-space:nowrap; color:var(--muted); font-size:13px; }
    .show input { accent-color:var(--accent); }
    .meter { height:12px; margin:16px 0 7px; overflow:hidden; border-radius:6px; background:#e7ebed; }
    .meter span { display:block; width:0; height:100%; transition:width .15s,background .15s; }
    .score { font-weight:700; }
    .meta { margin-top:4px; color:var(--muted); font-size:13px; }
    .checks { display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; margin-top:18px; padding-top:16px; border-top:1px solid var(--border); }
    .check { display:flex; gap:8px; align-items:center; font-size:14px; }
    .dot { width:10px; height:10px; flex:none; border-radius:50%; background:#cbd2d5; }
    .dot.ok { background:var(--accent); }
    .dot.bad { background:var(--danger); }
    .suggestions { margin:16px 0 0; padding-left:18px; color:#9a5800; }
    .privacy { margin:16px 0 0; color:var(--muted); font-size:12px; }
    @media (max-width:560px) { .wrap { margin:24px auto; } .password-row { display:block; } .show { margin-top:8px; } .checks { grid-template-columns:1fr; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Password Strength · 密码强度</h1>
    <p class="sub">离线估算字符池、常见模式和改进建议</p>
    <section class="tool" aria-label="密码强度分析器">
      <label for="password">密码</label>
      <div class="password-row">
        <input id="password" type="password" autocomplete="new-password" spellcheck="false" value="Tr0ub4dour&amp;9" placeholder="在此输入，不会上传或保存" />
        <label class="show"><input id="show" type="checkbox" /> 显示</label>
      </div>
      <div class="meter" aria-hidden="true"><span id="meter"></span></div>
      <div id="score" class="score" aria-live="polite">请输入密码</div>
      <div id="meta" class="meta"></div>
      <div id="checks" class="checks"></div>
      <ul id="suggestions" class="suggestions"></ul>
      <p class="privacy">分析完全在当前浏览器完成。结果是启发式估算，不等同于密码安全保证；重要账户请优先使用密码管理器生成的随机密码。</p>
    </section>
  </main>
  <script type="module">
    import { analyze } from './src/index.js';
    const $ = (id) => document.getElementById(id);
    const labels = ['非常弱','弱','中等','强','非常强'];
    const colors = ['#b42318','#c65d19','#a87800','#4d8b39','#176b52'];
    const checkLabels = [['tooShort','长度至少 8 位'],['hasLower','小写字母'],['hasUpper','大写字母'],['hasDigit','数字'],['hasSymbol','符号'],['hasSequential','避免连续序列'],['hasRepeats','避免重复字符'],['hasCommonPattern','避开常见密码'],['allSameClass','混合字符类']];
    function update() {
      const result = analyze($('password').value);
      const color = colors[result.score];
      $('meter').style.width = result.length ? `${Math.max(8,(result.score + 1) * 20)}%` : '0%';
      $('meter').style.background = color;
      $('score').textContent = result.length ? `强度 ${result.score}/4 · ${labels[result.score]}` : '请输入密码';
      $('score').style.color = result.length ? color : '';
      $('meta').textContent = result.length ? `估算熵 ${result.entropyBits} bits · 离线破解估算 ${result.crackEstimate} · ${result.length} 位` : '';
      $('checks').replaceChildren();
      for (const [key, label] of checkLabels) {
        const positive = ['hasLower','hasUpper','hasDigit','hasSymbol'].includes(key);
        const ok = positive ? result.flags[key] : !result.flags[key];
        const item = document.createElement('div'); item.className = 'check';
        const dot = document.createElement('span'); dot.className = `dot ${ok ? 'ok' : 'bad'}`;
        const text = document.createElement('span'); text.textContent = label;
        item.append(dot, text); $('checks').append(item);
      }
      $('suggestions').replaceChildren(...result.suggestions.map((suggestion) => { const li = document.createElement('li'); li.textContent = suggestion; return li; }));
    }
    $('password').addEventListener('input', update);
    $('show').addEventListener('change', () => { $('password').type = $('show').checked ? 'text' : 'password'; });
    update();
  </script>
</body>
</html>
