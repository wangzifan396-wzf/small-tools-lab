name: Bug report
description: Report incorrect selection, redaction, or output
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide a minimal repository layout and command without private code or credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
