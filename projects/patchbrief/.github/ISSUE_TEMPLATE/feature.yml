name: Context rule proposal
description: Propose a deterministic discovery or budgeting rule
title: "context: "
labels: [enhancement]
body:
  - type: textarea
    id: value
    attributes:
      label: Review value
      description: Explain why this context is useful around a changed file.
    validations:
      required: true
  - type: textarea
    id: cost
    attributes:
      label: Token and false-positive cost
    validations:
      required: true
