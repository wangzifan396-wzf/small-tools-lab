<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图表生成器 · Small Tools Lab</title>
<style>
  :root { --bg:#faf9f7; --panel:#fff; --ink:#23211e; --mut:#8a857d; --bd:#e7e3dc; --ac:#b8832f; --ac2:#2f7d7b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:980px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:23px; margin:0 0 4px; letter-spacing:.3px; }
  .sub { color:var(--mut); margin:0 0 22px; }
  .card { background:var(--panel); border:1px solid var(--bd); border-radius:14px; padding:16px; margin-bottom:16px; }
  label { font-size:13px; color:var(--mut); display:block; margin:0 0 6px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  .field { display:flex; flex-direction:column; gap:6px; }
  select, input[type=text] { padding:8px 10px; border:1px solid var(--bd); border-radius:8px; font:14px inherit; background:#fff; }
  button { font:14px/1 inherit; border:1px solid var(--bd); background:#fff; color:var(--ink); padding:9px 15px; border-radius:9px; cursor:pointer; transition:.15s; }
  button:hover { border-color:var(--ac); }
  button.pri { background:var(--ac); color:#fff; border-color:var(--ac); }
  textarea { width:100%; min-height:150px; border:1px solid var(--bd); border-radius:10px; padding:12px; font:13px/1.5 ui-monospace,monospace; resize:vertical; background:#fcfbf9; }
  #svgbox { width:100%; min-height:340px; border:1px solid var(--bd); border-radius:10px; background:#fff; display:flex; align-items:center; justify-content:center; padding:10px; overflow:auto; }
  .note { font-size:12.5px; color:var(--mut); margin-top:8px; }
  footer { color:var(--mut); font-size:12px; text-align:center; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span style="color:var(--ac2)">📊</span> 图表生成器</h1>
  <p class="sub">用纯 SVG 生成柱状 / 折线 / 饼图，零依赖、可缩放、能下载。数据每行一条：<code>标签,数值</code>。</p>

  <div class="card">
    <div class="row">
      <div class="field"><label>图表类型</label>
        <select id="type"><option value="bar">柱状图</option><option value="line">折线图</option><option value="pie">饼图</option></select>
      </div>
      <div class="field"><label>标题</label><input type="text" id="title" value="示例图表" style="width:200px" /></div>
      <button class="pri" id="gen" style="margin-left:auto;align-self:flex-end;">生成</button>
      <button id="download" style="align-self:flex-end;">下载 SVG</button>
    </div>
    <div class="row">
      <textarea id="data" spellcheck="false">一月,32&#10;二月,45&#10;三月,28&#10;四月,60&#10;五月,52</textarea>
    </div>
    <div id="svgbox"></div>
    <p class="note">颜色循环取自选板；数值自动归一。纯前端渲染，无外部库。</p>
  </div>

  <footer>Small Tools Lab · 纯前端零依赖</footer>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const COLORS = ['#2f7d7b','#b8832f','#3d6fb4','#a8436b','#5a8f3c','#8a6db5','#c06a2e','#46808f'];
  function parseData() {
    const rows = [];
    for (const raw of $('data').value.split(/\r?\n/)) {
      const line = raw.trim();
      if (!line || line.startsWith('#')) continue;
      const i = line.lastIndexOf(',');
      const label = (i < 0 ? line : line.slice(0, i)).trim();
      const num = parseFloat((i < 0 ? line : line.slice(i + 1)).trim());
      if (isNaN(num)) continue;
      rows.push({ label, value: num });
    }
    return rows;
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
  function render() {
    const rows = parseData();
    const box = $('svgbox');
    if (!rows.length) { box.innerHTML = '<p style="color:#8a857d">没有可用数据</p>'; return; }
    const W = 640, H = 360, pad = 48;
    const max = Math.max(...rows.map((r) => r.value), 1);
    const title = esc($('title').value || '');
    let svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" font-family="sans-serif">`;
    svg += `<text x="${W/2}" y="24" text-anchor="middle" font-size="16" fill="#23211e">${title}</text>`;
    if ($('type').value === 'bar') {
      const bw = (W - pad * 2) / rows.length;
      rows.forEach((r, i) => {
        const h = (r.value / max) * (H - pad * 2 - 20);
        const x = pad + i * bw, y = H - pad - h;
        svg += `<rect x="${x+6}" y="${y}" width="${bw-12}" height="${h}" fill="${COLORS[i%COLORS.length]}" rx="3"><title>${esc(r.label)}: ${r.value}</title></rect>`;
        svg += `<text x="${x+bw/2}" y="${y-6}" text-anchor="middle" font-size="11" fill="#23211e">${r.value}</text>`;
        svg += `<text x="${x+bw/2}" y="${H-pad+16}" text-anchor="middle" font-size="11" fill="#8a857d">${esc(r.label)}</text>`;
      });
      svg += `<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e7e3dc"/>`;
    } else if ($('type').value === 'line') {
      const step = (W - pad * 2) / (rows.length - 1 || 1);
      const pts = rows.map((r, i) => [pad + i * step, H - pad - (r.value / max) * (H - pad * 2 - 20)]);
      const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
      svg += `<path d="${d}" fill="none" stroke="${COLORS[0]}" stroke-width="2.5"/>`;
      pts.forEach((p, i) => {
        svg += `<circle cx="${p[0]}" cy="${p[1]}" r="3.5" fill="${COLORS[0]}"><title>${esc(rows[i].label)}: ${rows[i].value}</title></circle>`;
        svg += `<text x="${p[0]}" y="${H-pad+16}" text-anchor="middle" font-size="11" fill="#8a857d">${esc(rows[i].label)}</text>`;
      });
      svg += `<line x1="${pad}" y1="${H-pad}" x2="${W-pad}" y2="${H-pad}" stroke="#e7e3dc"/>`;
    } else {
      const total = rows.reduce((s, r) => s + r.value, 0) || 1;
      const cx = W/2, cy = H/2 + 6, R = 120;
      let ang = -Math.PI / 2;
      rows.forEach((r, i) => {
        const a2 = ang + (r.value / total) * Math.PI * 2;
        const x1 = cx + R * Math.cos(ang), y1 = cy + R * Math.sin(ang);
        const x2 = cx + R * Math.cos(a2), y2 = cy + R * Math.sin(a2);
        const large = (a2 - ang) > Math.PI ? 1 : 0;
        svg += `<path d="M${cx} ${cy} L${x1.toFixed(1)} ${y1.toFixed(1)} A${R} ${R} 0 ${large} 1 ${x2.toFixed(1)} ${y2.toFixed(1)} Z" fill="${COLORS[i%COLORS.length]}"><title>${esc(r.label)}: ${r.value}</title></path>`;
        ang = a2;
      });
      rows.forEach((r, i) => {
        const mid = -Math.PI/2 + (rows.slice(0,i).reduce((s,x)=>s+x.value,0) + r.value/2) / total * Math.PI * 2;
        svg += `<text x="${(cx + (R+18) * Math.cos(mid)).toFixed(1)}" y="${(cy + (R+18) * Math.sin(mid)).toFixed(1)}" text-anchor="middle" font-size="11" fill="#23211e">${esc(r.label)}</text>`;
      });
    }
    svg += '</svg>';
    box.innerHTML = svg;
    box.dataset.svg = svg;
  }
  $('gen').onclick = render;
  $('download').onclick = () => {
    const svg = $('svgbox').dataset.svg || '';
    if (!svg) return;
    const blob = new Blob([svg], { type: 'image/svg+xml' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'chart.svg'; a.click();
    URL.revokeObjectURL(a.href);
  };
  render();
</script>
</body>
</html>
