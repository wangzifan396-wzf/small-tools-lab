<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Compose project READMEs and social cover images locally in the browser.">
    <meta name="theme-color" content="#f4f6f3">
    <title>README Studio</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="src/readme.js" defer></script>
    <script src="src/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#studio">Skip to studio</a>
    <header class="app-header">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>README Studio</span>
      </a>
      <div class="header-actions">
        <span class="save-status" id="save-status"><i></i>Saved locally</span>
        <a class="icon-button" href="README.md" aria-label="Open project readme" title="Project readme">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/></svg>
        </a>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Use dark theme" title="Toggle theme">
          <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main id="studio">
      <aside class="form-panel" aria-labelledby="settings-title">
        <div class="panel-heading">
          <div><span>01 / CONTENT</span><h1 id="settings-title">Project details</h1></div>
          <button class="icon-button" id="reset-button" type="button" aria-label="Reset project details" title="Reset">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
          </button>
        </div>

        <fieldset class="template-fieldset">
          <legend>Project type</legend>
          <div class="segmented" role="group" aria-label="Project type template">
            <button type="button" data-template="app" aria-pressed="true">Web app</button>
            <button type="button" data-template="library">Library</button>
            <button type="button" data-template="cli">CLI</button>
          </div>
        </fieldset>

        <div class="form-section">
          <div class="form-section-title"><span>Identity</span><i></i></div>
          <label>Project name<input id="project-name" data-field="name" maxlength="54"></label>
          <label>Tagline<input id="tagline" data-field="tagline" maxlength="120"></label>
          <label>Description<textarea id="description" data-field="description" rows="3" maxlength="420"></textarea></label>
          <div class="two-columns">
            <label>Repository URL<input id="repository" data-field="repository" type="url"></label>
            <label>License<select id="license" data-field="license"><option>MIT</option><option>Apache-2.0</option><option>GPL-3.0</option><option>BSD-3-Clause</option><option>MPL-2.0</option><option>Unlicense</option></select></label>
          </div>
        </div>

        <div class="form-section">
          <div class="form-section-title"><span>Usage</span><i></i></div>
          <label>Install command<textarea id="install-command" data-field="installCommand" rows="2" spellcheck="false"></textarea></label>
          <label>Usage example<textarea id="usage" data-field="usage" rows="4" spellcheck="false"></textarea></label>
          <label>Code language<input id="language" data-field="language" maxlength="20" spellcheck="false"></label>
        </div>

        <div class="form-section">
          <div class="form-section-title"><span>Lists</span><i></i></div>
          <label>Features <small>One per line</small><textarea id="features" data-list="features" rows="5"></textarea></label>
          <label>Roadmap <small>One per line</small><textarea id="roadmap" data-list="roadmap" rows="3"></textarea></label>
          <label>Tech stack <small>Comma separated</small><input id="stack" data-list="stack"></label>
        </div>

        <div class="form-section">
          <div class="form-section-title"><span>Sections</span><i></i></div>
          <div class="toggle-grid">
            <label class="check-row"><input type="checkbox" data-toggle="cover" checked><span>Cover image</span></label>
            <label class="check-row"><input type="checkbox" data-toggle="badges" checked><span>Badges</span></label>
            <label class="check-row"><input type="checkbox" data-toggle="toc" checked><span>Contents</span></label>
            <label class="check-row"><input type="checkbox" data-toggle="contributing" checked><span>Contributing</span></label>
            <label class="check-row"><input type="checkbox" data-toggle="roadmap" checked><span>Roadmap</span></label>
            <label class="check-row"><input type="checkbox" data-toggle="license" checked><span>License</span></label>
          </div>
        </div>

        <div class="form-section color-section">
          <div class="form-section-title"><span>Cover color</span><i></i></div>
          <div class="color-control">
            <input id="accent-color" type="color" value="#52a58d" aria-label="Cover accent color">
            <div class="color-presets" role="group" aria-label="Cover color presets">
              <button type="button" style="--color:#52a58d" data-color="#52a58d" aria-label="Green"></button>
              <button type="button" style="--color:#dfb247" data-color="#dfb247" aria-label="Yellow"></button>
              <button type="button" style="--color:#da6450" data-color="#da6450" aria-label="Coral"></button>
              <button type="button" style="--color:#5c82c3" data-color="#5c82c3" aria-label="Blue"></button>
              <button type="button" style="--color:#8a6bbb" data-color="#8a6bbb" aria-label="Purple"></button>
            </div>
          </div>
        </div>
      </aside>

      <section class="workspace-panel" aria-labelledby="workspace-title">
        <div class="workspace-toolbar">
          <div>
            <span>02 / OUTPUT</span>
            <h2 id="workspace-title">README workspace</h2>
          </div>
          <div class="output-stats"><span id="section-count">0 sections</span><span id="character-count">0 chars</span></div>
          <div class="view-tabs" role="tablist" aria-label="README output view">
            <button type="button" role="tab" aria-selected="true" data-view="preview">Preview</button>
            <button type="button" role="tab" aria-selected="false" tabindex="-1" data-view="markdown">Markdown</button>
          </div>
          <div class="toolbar-actions">
            <button class="button" id="copy-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copy
            </button>
            <button class="button primary" id="download-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
              README.md
            </button>
          </div>
        </div>

        <div class="cover-tool">
          <canvas id="cover-canvas" width="1200" height="630" aria-label="Generated project cover"></canvas>
          <div class="cover-actions">
            <span>1200 × 630 PNG</span>
            <button class="button compact" id="cover-download" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
              Cover
            </button>
          </div>
        </div>

        <article class="readme-preview" id="preview-output"></article>
        <pre class="markdown-output" id="markdown-output" tabindex="0" hidden></pre>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
