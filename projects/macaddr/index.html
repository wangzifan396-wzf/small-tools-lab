<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MAC 地址工具 · small-tools-lab</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#4f9dff; --accent2:#7c5cff;
    --ok:#3ecf8e; --warn:#ffb454; --code:#0b0d12;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  label{display:block;color:var(--muted);margin:0 0 6px;font-size:12px;letter-spacing:.3px}
  input,select{width:100%;background:var(--code);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:10px 12px;font:13px/1.4 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:140px}
  button{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;
    border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;font-weight:600}
  button.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
  button:active{transform:translateY(1px)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .out{background:var(--code);border:1px solid var(--border);border-radius:8px;padding:12px;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-all;min-height:42px}
  .tag{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:999px;
    padding:2px 10px;margin:3px 6px 0 0;font-size:12px;color:var(--muted)}
  .tag b{color:var(--text)}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  code.k{color:var(--accent)}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>MAC 地址工具</h1>
  <p class="sub">格式化 / 随机生成 / 厂商(OUI)识别 — 零依赖，本地运行</p>

  <div class="card">
    <label>输入 MAC（支持冒号 / 连字符 / 点 / 无分隔任意混合）</label>
    <input id="inp" value="aabb.cc00.1234" spellcheck="false" />
    <div class="btns">
      <button onclick="go()">解析</button>
      <button class="ghost" onclick="randomLocal()">随机生成</button>
      <button class="ghost" onclick="clearIn()">清空</button>
    </div>
    <div class="out" id="out" style="margin-top:12px">—</div>
    <div id="tags" style="margin-top:10px"></div>
  </div>

  <div class="card">
    <label>随机生成选项</label>
    <div class="row">
      <div>
        <label>分隔符</label>
        <select id="sep">
          <option value=":">冒号 :</option>
          <option value="-">连字符 -</option>
          <option value=".">点 .</option>
          <option value="">无</option>
        </select>
      </div>
      <div>
        <label>固定厂商 OUI（可选，6 位十六进制）</label>
        <input id="oui" placeholder="如 001B63" spellcheck="false" />
      </div>
    </div>
    <div class="btns">
      <button onclick="randomLocal()">生成随机 MAC</button>
    </div>
    <div class="hint">默认生成本地管理位(local)置位的单播地址；固定 OUI 时保留原厂前缀位。</div>
  </div>

  <footer><a href="../index.html">← 返回工具箱</a> · small-tools-lab</footer>
</div>

<script src="src/macaddr.js"></script>
<script>
  var $=function(id){return document.getElementById(id);};
  function render(mac){
    var norm = MacAddr.normalize(mac);
    if(!norm){ $("out").textContent = "✗ 无法识别为 12 位十六进制 MAC"; $("tags").innerHTML=""; return; }
    var v = MacAddr.vendor(mac);
    var lines = [
      "规范形式 : " + norm,
      "无分隔   : " + MacAddr.format(mac,"",true),
      "连字符   : " + MacAddr.format(mac,"-",true),
      "点分隔   : " + MacAddr.format(mac,".",true),
      "小写     : " + MacAddr.format(mac,":",false),
      "OUI      : " + MacAddr.oui(mac)
    ];
    $("out").textContent = lines.join("\n");
    var tags = "";
    tags += '<span class="tag">类型: <b>'+(MacAddr.isMulticast(mac)?"多播":"单播")+'</b></span>';
    tags += '<span class="tag">管理: <b>'+(MacAddr.isLocal(mac)?"本地":"全局")+'</b></span>';
    tags += '<span class="tag">厂商: <b>'+(v.vendor || "未知")+'</b></span>';
    $("tags").innerHTML = tags;
  }
  function go(){ render($("inp").value); }
  function randomLocal(){
    var r = MacAddr.random({ sep:$("sep").value, oui:$("oui").value.trim()||undefined });
    $("inp").value = r; render(r);
  }
  function clearIn(){ $("inp").value=""; $("out").textContent="—"; $("tags").innerHTML=""; }
  go();
</script>
</body>
</html>
