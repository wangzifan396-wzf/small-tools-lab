<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Markdown 预览 · Small Tools Lab</title>
<style>
  :root { --bg:#faf9f7; --panel:#fff; --ink:#23211e; --mut:#8a857d; --bd:#e7e3dc; --ac:#b8832f; --ac2:#2f7d7b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:1000px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:23px; margin:0 0 4px; letter-spacing:.3px; }
  .sub { color:var(--mut); margin:0 0 22px; }
  .card { background:var(--panel); border:1px solid var(--bd); border-radius:14px; padding:16px; margin-bottom:16px; }
  label { font-size:13px; color:var(--mut); display:block; margin:0 0 6px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  button { font:14px/1 inherit; border:1px solid var(--bd); background:#fff; color:var(--ink); padding:9px 15px; border-radius:9px; cursor:pointer; transition:.15s; }
  button:hover { border-color:var(--ac); }
  button.pri { background:var(--ac); color:#fff; border-color:var(--ac); }
  textarea { width:100%; min-height:300px; border:1px solid var(--bd); border-radius:10px; padding:12px; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace; resize:vertical; background:#fcfbf9; color:var(--ink); }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  #preview { border:1px solid var(--bd); border-radius:10px; padding:14px 18px; background:#fff; min-height:300px; overflow:auto; }
  #preview h1,#preview h2,#preview h3 { line-height:1.3; }
  #preview h1 { font-size:22px; border-bottom:1px solid var(--bd); padding-bottom:6px; }
  #preview h2 { font-size:18px; } #preview h3 { font-size:15px; }
  #preview code { background:#f1efe9; padding:1px 5px; border-radius:4px; font-family:ui-monospace,monospace; font-size:12.5px; }
  #preview pre { background:#f1efe9; padding:12px; border-radius:8px; overflow:auto; }
  #preview pre code { background:none; padding:0; }
  #preview blockquote { border-left:3px solid var(--ac); margin:8px 0; padding:4px 14px; color:var(--mut); }
  #preview a { color:var(--ac2); }
  #preview hr { border:0; border-top:1px solid var(--bd); margin:14px 0; }
  .note { font-size:12.5px; color:var(--mut); margin-top:8px; }
  footer { color:var(--mut); font-size:12px; text-align:center; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span style="color:var(--ac2)">📄</span> Markdown 预览</h1>
  <p class="sub">轻量 Markdown 渲染（标题 / 粗斜体 / 行内与围栏代码 / 列表 / 引用 / 链接 / 分割线）。纯浏览器零依赖。</p>

  <div class="card">
    <div class="row">
      <label style="margin:0 8px 0 0;display:flex;align-items:center;gap:6px;"><input type="checkbox" id="auto" checked /> 自动渲染</label>
      <button id="sample">载入示例</button>
      <button id="copyHtml">复制 HTML</button>
    </div>
    <div class="cols">
      <div><label>Markdown</label><textarea id="src" spellcheck="false"></textarea></div>
      <div><label>预览</label><div id="preview"></div></div>
    </div>
    <p class="note">这是「子集」渲染器，覆盖常见写法；不支持表格、脚注、嵌套列表等复杂语法。输出已做 HTML 转义与链接协议校验，可安全预览。</p>
  </div>

  <footer>Small Tools Lab · 纯前端零依赖</footer>
</div>
<script>
  const $ = (id) => document.getElementById(id);
  const SAMPLE = '# 标题一\n\n这是 **粗体** 与 *斜体*，还有 `行内代码`。\n\n## 列表\n\n- 项目 A\n- 项目 B\n\n1. 第一\n2. 第二\n\n> 引用一句话\n\n```\n代码围栏\n```\n\n[访问 Small Tools Lab](https://example.com)\n\n---';
  function esc(s) { return s.replace(/[&<>"]/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }
  function inline(text) {
    const codes = [];
    text = text.replace(/`([^`]+)`/g, (_, c) => { codes.push(c); return '\u0000' + (codes.length - 1) + '\u0000'; });
    text = esc(text);
    text = text.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
    text = text.replace(/(^|[^*])\*([^*]+)\*/g, '$1<em>$2</em>');
    text = text.replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, u) => {
      const safe = /^(https?:\/\/|mailto:|\/)/i.test(u) ? u : '#';
      return `<a href="${esc(safe)}" target="_blank" rel="noopener">${t}</a>`;
    });
    text = text.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${esc(codes[+i])}</code>`);
    return text;
  }
  function render() {
    const src = $('src').value;
    const lines = src.split(/\r?\n/);
    let html = '', i = 0, listType = null;
    const closeList = () => { if (listType) { html += `</${listType}>`; listType = null; } };
    while (i < lines.length) {
      let line = lines[i];
      if (/^```/.test(line)) {
        closeList();
        const buf = []; i++;
        while (i < lines.length && !/^```/.test(lines[i])) { buf.push(lines[i]); i++; }
        i++;
        html += `<pre><code>${esc(buf.join('\n'))}</code></pre>`;
        continue;
      }
      const h = line.match(/^(#{1,6})\s+(.*)$/);
      if (h) { closeList(); const lv = h[1].length; html += `<h${lv}>${inline(h[2])}</h${lv}>`; i++; continue; }
      if (/^(\-\-\-|\*\*\*|___)$/.test(line.trim())) { closeList(); html += '<hr/>'; i++; continue; }
      if (/^>\s?/.test(line)) { closeList(); html += `<blockquote>${inline(line.replace(/^>\s?/, ''))}</blockquote>`; i++; continue; }
      const ul = line.match(/^[-*]\s+(.*)$/);
      const ol = line.match(/^\d+\.\s+(.*)$/);
      if (ul || ol) {
        const t = ul ? 'ul' : 'ol';
        if (listType !== t) { closeList(); html += `<${t}>`; listType = t; }
        html += `<li>${inline((ul || ol)[1])}</li>`; i++; continue;
      }
      if (line.trim() === '') { closeList(); i++; continue; }
      closeList();
      html += `<p>${inline(line)}</p>`; i++;
    }
    closeList();
    $('preview').innerHTML = html;
  }
  $('auto').onchange = () => { if ($('auto').checked) render(); };
  $('src').addEventListener('input', () => { if ($('auto').checked) render(); });
  $('sample').onclick = () => { $('src').value = SAMPLE; render(); };
  $('copyHtml').onclick = () => { const r = document.createRange(); r.selectNode($('preview')); const sel = window.getSelection(); sel.removeAllRanges(); sel.addRange(r); document.execCommand('copy'); sel.removeAllRanges(); };
  $('src').value = SAMPLE; render();
</script>
</body>
</html>
