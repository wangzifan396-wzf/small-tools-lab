<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RSA 加解密 · small-tools-lab</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#4f9dff; --accent2:#7c5cff;
    --ok:#3ecf8e; --code:#0b0d12;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:820px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  label{display:block;color:var(--muted);margin:0 0 6px;font-size:12px;letter-spacing:.3px}
  textarea{width:100%;background:var(--code);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:10px 12px;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    resize:vertical;word-break:break-all}
  .row{display:flex;gap:10px;flex-wrap:wrap}
  .row>*{flex:1;min-width:200px}
  button{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;
    border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;font-weight:600}
  button.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
  button:active{transform:translateY(1px)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  .key{font:11px/1.4 ui-monospace,monospace;color:var(--muted);word-break:break-all;
    background:var(--code);border:1px solid var(--border);border-radius:8px;padding:8px 10px;max-height:120px;overflow:auto}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
  a{color:var(--accent)}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--border);border-radius:999px;padding:2px 10px;font-size:12px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <h1>RSA 密钥生成与加解密 <span class="pill" id="status">就绪</span></h1>
  <p class="sub">纯 JS 实现（Miller–Rabin 素数 + PKCS#1 v1.5），与 OpenSSL/Node 互通 · 本地运行</p>

  <div class="card">
    <label>1 · 生成密钥对</label>
    <div class="btns">
      <button onclick="gen(1024)">生成 1024-bit</button>
      <button onclick="gen(2048)">生成 2048-bit</button>
      <button class="ghost" onclick="copyAll()">复制全部</button>
    </div>
    <label style="margin-top:12px">n（公钥模数，十六进制）</label>
    <div class="key" id="kN">—</div>
    <div class="row" style="margin-top:8px">
      <div><label>e（公钥指数）</label><div class="key" id="kE">—</div></div>
      <div><label>d（私钥指数）</label><div class="key" id="kD">—</div></div>
    </div>
    <div class="hint" id="genInfo"></div>
  </div>

  <div class="card">
    <label>2 · 加密（使用公钥 n + e）</label>
    <textarea id="plain" rows="3" placeholder="输入要加密的文本…">Hello RSA</textarea>
    <div class="row" style="margin-top:8px">
      <div><label>公钥 n（hex）</label><textarea id="encN" rows="2" placeholder="粘贴 n 十六进制"></textarea></div>
      <div><label>公钥 e（hex）</label><textarea id="encE" rows="2" placeholder="如 010001"></textarea></div>
    </div>
    <div class="btns"><button onclick="doEnc()">加密 → 密文(hex)</button></div>
    <textarea id="cipher" rows="3" style="margin-top:10px" placeholder="密文输出…"></textarea>
  </div>

  <div class="card">
    <label>3 · 解密（使用私钥 n + d）</label>
    <textarea id="cipher2" rows="3" placeholder="粘贴密文(hex)…"></textarea>
    <div class="row" style="margin-top:8px">
      <div><label>私钥 n（hex）</label><textarea id="decN" rows="2" placeholder="粘贴 n 十六进制"></textarea></div>
      <div><label>私钥 d（hex）</label><textarea id="decD" rows="2" placeholder="粘贴 d 十六进制"></textarea></div>
    </div>
    <div class="btns"><button onclick="doDec()">解密 → 明文</button></div>
    <textarea id="decrypted" rows="3" style="margin-top:10px" placeholder="明文输出…"></textarea>
  </div>

  <footer><a href="../index.html">← 返回工具箱</a> · small-tools-lab</footer>
</div>

<script src="src/rsa.js"></script>
<script>
  var $=function(id){return document.getElementById(id);};
  function setStatus(s){ $("status").textContent = s; }
  function gen(bits){
    setStatus("生成中…");
    // allow UI to repaint before the (sync) heavy compute
    setTimeout(function(){
      var t0 = performance.now();
      var kp = RSA.keygen(bits);
      var dt = (performance.now()-t0).toFixed(0);
      $("kN").textContent = kp.nHex; $("kE").textContent = kp.eHex; $("kD").textContent = kp.dHex;
      // prefill encrypt/decrypt boxes
      $("encN").value = kp.nHex; $("encE").value = kp.eHex;
      $("decN").value = kp.nHex; $("decD").value = kp.dHex;
      $("genInfo").textContent = bits + "-bit · 用时 " + dt + " ms · n = p × q 已校验";
      setStatus("已生成 " + bits + "-bit");
    }, 16);
  }
  function doEnc(){
    try{
      var c = RSA.encrypt($("plain").value, $("encN").value.trim(), $("encE").value.trim());
      $("cipher").value = c;
    }catch(e){ alert("加密失败: " + e.message); }
  }
  function doDec(){
    try{
      var m = RSA.decrypt($("cipher2").value.trim(), $("decN").value.trim(), $("decD").value.trim());
      $("decrypted").value = m;
    }catch(e){ alert("解密失败: " + e.message); }
  }
  function copyAll(){
    var t = "n="+$("kN").textContent+"\ne="+$("kE").textContent+"\nd="+$("kD").textContent;
    if(navigator.clipboard) navigator.clipboard.writeText(t);
  }
</script>
</body>
</html>
