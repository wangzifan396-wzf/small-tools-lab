<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>哈希类型识别器</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e7eaf0; --muted:#9aa4b2; --accent:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--fg); padding:28px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 18px; font-size:13.5px; }
  label { display:block; color:var(--muted); font-size:12.5px; margin:0 0 6px; }
  input { width:100%; background:var(--panel); color:var(--fg); border:1px solid var(--line);
    border-radius:10px; padding:11px; font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .bar { display:flex; gap:10px; margin:14px 0; flex-wrap:wrap; }
  button { background:var(--accent); color:#0b1020; border:0; border-radius:9px; padding:9px 16px; font-weight:600; cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); font-weight:500; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:16px; margin-top:6px; }
  .item { display:flex; justify-content:space-between; gap:12px; padding:10px 0; border-bottom:1px solid var(--line); }
  .item:last-child { border-bottom:0; }
  .item .nm { font-weight:700; color:var(--accent); }
  .item .nt { color:var(--muted); font-size:13px; text-align:right; }
  .hint { color:var(--muted); font-size:12px; margin-top:8px; }
  .empty { color:var(--muted); padding:14px 0; }
</style>
</head>
<body>
  <h1>哈希类型识别器</h1>
  <p class="sub">零依赖 · 通过前缀、长度、字符集推断哈希可能的算法（MD5 / SHA 系列 / bcrypt / Argon2 等）。仅识别类型，不还原明文。</p>

  <label>哈希值</label>
  <input id="in" placeholder="5d41402abc4b2a76b9719d911017c592 或 $2a$10$..." />
  <div class="bar">
    <button id="go">识别</button>
    <button class="ghost" id="sample">示例 MD5</button>
    <button class="ghost" id="clear">清空</button>
    <span class="hint" id="stat"></span>
  </div>

  <div class="card" id="result"><div class="empty">结果将显示在这里</div></div>

  <script src="src/hashid.js"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    function render(list) {
      if (!list.length) { $('result').innerHTML = '<div class="empty">无法识别</div>'; return; }
      $('result').innerHTML = list.map(function (x) {
        return '<div class="item"><span class="nm">' + x.name + '</span><span class="nt">' + x.note + '</span></div>';
      }).join("");
    }
    function go() {
      var v = $('in').value.trim();
      if (!v) { $('stat').textContent = "请输入哈希值"; return; }
      try { render(Hashid.identify(v)); $('stat').textContent = "候选算法：" + Hashid.identify(v).length; }
      catch (e) { $('stat').textContent = "错误：" + e.message; }
    }
    $('go').onclick = go;
    $('sample').onclick = function () { $('in').value = "5d41402abc4b2a76b9719d911017c592"; go(); };
    $('clear').onclick = function () { $('in').value = ''; $('stat').textContent = ''; $('result').innerHTML = '<div class="empty">结果将显示在这里</div>'; };
    $('in').addEventListener("input", go);
  </script>
</body>
</html>
