<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ID / Token 生成器 · Small Tools Lab</title>
<style>
  :root { --bg:#faf9f7; --panel:#fff; --ink:#23211e; --mut:#8a857d; --bd:#e7e3dc; --ac:#b8832f; --ac2:#2f7d7b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:860px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:23px; margin:0 0 4px; letter-spacing:.3px; }
  .sub { color:var(--mut); margin:0 0 22px; }
  .card { background:var(--panel); border:1px solid var(--bd); border-radius:14px; padding:16px; margin-bottom:16px; }
  label { font-size:13px; color:var(--mut); display:block; margin:0 0 6px; }
  input[type=text], input[type=number] { border:1px solid var(--bd); border-radius:8px; padding:9px 11px; font:14px ui-monospace,monospace; background:#fff; color:var(--ink); }
  input[type=text] { width:100%; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:12px; }
  button { font:14px/1 inherit; border:1px solid var(--bd); background:#fff; color:var(--ink); padding:9px 15px; border-radius:9px; cursor:pointer; transition:.15s; }
  button:hover { border-color:var(--ac); }
  button.pri { background:var(--ac); color:#fff; border-color:var(--ac); }
  .field { display:flex; flex-direction:column; gap:4px; }
  textarea { width:100%; min-height:160px; border:1px solid var(--bd); border-radius:10px; padding:10px 12px; font:13px ui-monospace,monospace; resize:vertical; background:#fcfbf9; color:var(--ink); }
  .note { font-size:12.5px; color:var(--mut); margin-top:8px; }
  .ico { color:var(--ac2); }
  footer { color:var(--mut); font-size:12px; text-align:center; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="ico">🎲</span> ID / Token 生成器</h1>
  <p class="sub">基于 Web Crypto 的安全随机 ID，支持自定义字母表与批量生成。纯浏览器零依赖。</p>

  <div class="card">
    <div class="row">
      <div class="field"><label>长度</label><input type="number" id="len" value="21" min="1" max="128" style="width:90px;" /></div>
      <div class="field" style="flex:1;"><label>字母表</label><input type="text" id="alpha" value="ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789-_" /></div>
      <div class="field"><label>数量</label><input type="number" id="count" value="5" min="1" max="500" style="width:90px;" /></div>
    </div>
    <div class="row">
      <button class="pri" id="gen">生成</button>
      <button id="copy">复制全部</button>
      <button id="copy1">复制首条</button>
    </div>
    <div class="note" id="note">使用 <code>crypto.getRandomValues</code>，采用拒绝采样消除取模偏差。默认字母表为 URL-safe（nanoid 兼容）。</div>
  </div>

  <div class="card">
    <label>结果</label>
    <textarea id="out" readonly placeholder="生成的 ID 将显示在这里"></textarea>
  </div>

  <footer>Small Tools Lab · 纯前端 · 数据不出本机</footer>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  function genOne(len, alpha){
    const n = alpha.length;
    const max = Math.floor(256 / n) * n; // 2^8 内的最大整数倍
    const bytes = new Uint8Array(len);
    let out = "";
    let i = 0, filled = 0;
    while(filled < len){
      crypto.getRandomValues(bytes);
      for(let j=0;j<len && filled<len;j++){
        const b = bytes[j];
        if(b < max){ out += alpha[b % n]; filled++; }
      }
    }
    return out;
  }
  function gen(){
    const len = Math.max(1, Math.min(128, +$("len").value || 21));
    const count = Math.max(1, Math.min(500, +$("count").value || 1));
    const alpha = $("alpha").value || "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const ids = [];
    for(let i=0;i<count;i++) ids.push(genOne(len, alpha));
    $("out").value = ids.join("\n");
    $("note").textContent = "已生成 " + count + " 个长度为 " + len + " 的 ID，字母表共 " + alpha.length + " 个字符。";
  }
  $("gen").onclick = gen;
  $("copy").onclick = () => navigator.clipboard.writeText($("out").value);
  $("copy1").onclick = () => navigator.clipboard.writeText(($("out").value.split("\n")[0]||""));
  gen();
})();
</script>
</body>
</html>
