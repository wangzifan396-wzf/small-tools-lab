<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jwtpeek · JWT 解码</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --border: #e7e4dd; --border-strong: #d8d4ca;
    --text: #22211e; --text-2: #56534c; --muted: #8b877e;
    --accent: #6a5acd; --accent-soft: #ece9f9; --ok: #3d8f61; --warn: #c0792b; --bad: #c0392b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14; --panel: #151922; --border: #232b3a; --border-strong: #34415a;
      --text: #e9edf5; --text-2: #aab3c6; --muted: #6e788e;
      --accent: #9d8cff; --accent-soft: #1d1a2e; --ok: #5fd0a0; --warn: #f0b269; --bad: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 28px 16px;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 820px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  textarea {
    width: 100%; min-height: 92px; padding: 12px 14px; border-radius: var(--r);
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-family: var(--mono); font-size: 13px; resize: vertical; line-height: 1.5;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
  .chip { font-size: 12.5px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text-2); cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; margin-top: 14px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px){ .grid2 { grid-template-columns: 1fr; } }
  .card h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-word; font-family: var(--mono); font-size: 12.5px; color: var(--text); }
  .sig { font-family: var(--mono); font-size: 12px; color: var(--text-2); word-break: break-all; }
  .badge { display: inline-block; font-size: 13px; font-weight: 700; padding: 6px 14px; border-radius: 999px; }
  .badge.valid { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.expired { background: color-mix(in srgb, var(--bad) 18%, transparent); color: var(--bad); }
  .badge.not-yet { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .badge.no-exp { background: var(--accent-soft); color: var(--accent); }
  .badge.none { background: var(--border); color: var(--muted); }
  .meta { font-size: 13.5px; margin-top: 8px; }
  .meta b { font-weight: 600; }
  .warnline { color: var(--warn); font-size: 13px; margin-top: 10px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔑 jwtpeek · JWT 解码</h1>
  <p class="sub">解码 JWT 的 header / payload、显示过期时间。<strong>纯前端运行，仅解码、不校验签名。</strong></p>

  <textarea id="token" placeholder="粘贴 JWT（header.payload.signature）…">eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IuW8oOS4iSIsImFkbWluIjp0cnVlLCJpYXQiOjE1MTYyMzkwMjIsImV4cCI6NDEwMjQ0NDgwMH0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c</textarea>

  <div class="row">
    <span class="chip" id="example">载入示例</span>
    <span class="chip" id="clear">清空</span>
  </div>

  <div class="card" id="status-card" style="display:none">
    <span class="badge none" id="status">—</span>
    <div class="meta" id="meta"></div>
    <div class="warnline" id="warn"></div>
  </div>

  <div class="grid2">
    <div class="card">
      <h3>Header</h3>
      <pre id="header">—</pre>
    </div>
    <div class="card">
      <h3>Payload</h3>
      <pre id="payload">—</pre>
    </div>
  </div>

  <div class="card">
    <h3>Signature（未校验）</h3>
    <div class="sig" id="sig">—</div>
  </div>

  <p class="foot">⚠️ 本工具只解码，不验证签名 — 任何人都可伪造 token，请勿据此信任身份 · 零依赖</p>
</div>

<script>
// --- inlined core (mirrors src/core/jwt.js) so this page runs over file:// ---
const JWT_RE = /^([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]+)\.([A-Za-z0-9_-]*)$/;
function b64urlDecode(segment){
  let s = String(segment==null?"":segment).replace(/-/g,"+").replace(/_/g,"/");
  while(s.length%4) s+="=";
  const bin = atob(s);
  const bytes = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function decodeSegment(segment){
  try { return { ok:true, value: JSON.parse(b64urlDecode(segment)) }; }
  catch { return { ok:false, value:null }; }
}
function toIso(ts){
  if(typeof ts!=="number"||!Number.isFinite(ts)) return null;
  const ms = ts<1e12 ? ts*1000 : ts;
  const d = new Date(ms);
  if(Number.isNaN(d.getTime())) return null;
  return d.toISOString().replace(".000Z","Z");
}
function parse(token, now){
  now = now || Date.now();
  const s = String(token==null?"":token).trim();
  const m = JWT_RE.exec(s);
  if(!m) return { valid:false, error:"not-a-jwt" };
  const header = decodeSegment(m[1]);
  const payload = decodeSegment(m[2]);
  const signature = m[3]||"";
  const p = payload.value||{};
  const exp = typeof p.exp==="number"?p.exp:null;
  const iat = typeof p.iat==="number"?p.iat:null;
  const nbf = typeof p.nbf==="number"?p.nbf:null;
  let status="no-exp", msUntilExp=null, notYet=false;
  if(exp!=null){ const e=exp<1e12?exp*1000:exp; msUntilExp=e-now; status=msUntilExp>0?"valid":"expired"; }
  if(nbf!=null){ const n=nbf<1e12?nbf*1000:nbf; notYet=n>now; if(notYet) status="not-yet"; }
  return {
    valid:true, header:header.value, payload:p, hasSignature:signature.length>0, signature,
    claimCount: p&&typeof p==="object"?Object.keys(p).length:0,
    timing:{ exp, expAt:toIso(exp), iat, iatAt:toIso(iat), nbf, nbfAt:toIso(nbf), status, msUntilExp, notYet, hasExpiry:exp!=null },
  };
}
function fmtDate(iso){ if(!iso) return "—"; const d=new Date(iso); return iso.replace("T"," ").replace("Z"," UTC"); }

const EXAMPLE = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIiwibmFtZSI6IuW8oOS4iSIsImFkbWluIjp0cnVlLCJpYXQiOjE1MTYyMzkwMjIsImV4cCI6NDEwMjQ0NDgwMH0.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c";
const $=(id)=>document.getElementById(id);

function render(){
  const tok=$('token').value.trim();
  const card=$('status-card');
  if(!tok){ card.style.display='none'; $('header').textContent='—'; $('payload').textContent='—'; $('sig').textContent='—'; return; }
  const r = parse(tok);
  card.style.display='block';
  const badge=$('status'), meta=$('meta'), warn=$('warn');
  if(!r.valid){
    badge.className='badge none'; badge.textContent='不是合法 JWT';
    meta.innerHTML=''; warn.textContent='应为 header.payload.signature 三段 base64url。';
    $('header').textContent='—'; $('payload').textContent='—'; $('sig').textContent='—';
    return;
  }
  const t=r.timing;
  const labels={ 'valid':'✅ 有效（未过期）', 'expired':'⛔ 已过期', 'not-yet':'⏳ 尚未生效', 'no-exp':'♾️ 永不过期' };
  badge.className='badge '+t.status; badge.textContent=labels[t.status]||t.status;
  let html='';
  html += `<div><b>算法</b> ${r.header&&r.header.alg?r.header.alg:'?'} · <b>类型</b> ${r.header&&r.header.typ?r.header.typ:'?'}</div>`;
  html += `<div><b>签名</b> ${r.hasSignature?('有（'+r.signature.length+' 字符）'):'无（未签名）'} · <b>声明</b> ${r.claimCount} 项</div>`;
  if(t.hasExpiry) html += `<div><b>过期</b> ${fmtDate(t.expAt)}</div>`; else html += `<div><b>过期</b> 无 exp（永不过期）</div>`;
  if(t.iatAt) html += `<div><b>签发</b> ${fmtDate(t.iatAt)}</div>`;
  if(t.notYet && t.nbfAt) html += `<div><b>生效</b> ${fmtDate(t.nbfAt)}（尚未生效）</div>`;
  meta.innerHTML=html;
  warn.textContent='⚠️ 仅解码，未校验签名 — 不可据此信任身份。';
  $('header').textContent = r.header?JSON.stringify(r.header,null,2):'(无法解析)';
  $('payload').textContent = JSON.stringify(r.payload,null,2);
  $('sig').textContent = r.signature||'(空)';
}
$('token').addEventListener('input', render);
$('example').onclick=()=>{ $('token').value=EXAMPLE; render(); };
$('clear').onclick=()=>{ $('token').value=''; render(); };
render();
</script>
</body>
</html>
