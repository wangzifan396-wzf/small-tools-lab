<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
  <title>curlcon · Small Tools Lab</title>
  <style>
    :root{color-scheme:dark;--bg:#101318;--card:#181c23;--text:#e7ebf1;--muted:#9ca6b4;--line:#2d3440;--accent:#73a8ff;--warn:#f2bf5e;--bad:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1040px;margin:auto;padding:32px 20px 60px}h1{margin:0;font-size:26px}.sub{color:var(--muted);margin:5px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}textarea{width:100%;border:1px solid var(--line);border-radius:9px;background:#12161c;color:var(--text);padding:11px;font:13px/1.55 ui-monospace,monospace;resize:vertical}#input{min-height:130px}#output{min-height:360px}.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:11px}button,select{border:1px solid var(--line);border-radius:8px;background:#151922;color:var(--text);padding:9px 13px}button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#0b1628;font-weight:650}select{margin-left:auto}.error{min-height:24px;color:var(--bad);margin-top:8px}.warnings{color:var(--warn);font-size:13px;margin:8px 0 0;padding-left:20px}.note{color:var(--muted);font-size:13px}
  </style>
</head>
<body><main class="wrap"><h1>curlcon</h1><p class="sub">将 curl 转为 Fetch 或 Python requests。仅解析文本，不执行命令。</p>
  <section class="card"><label for="input">curl 命令</label><textarea id="input" spellcheck="false"></textarea><div class="actions"><button class="primary" id="convert">转换</button><button id="sample">示例</button></div><div id="error" class="error" role="alert"></div><ul id="warnings" class="warnings"></ul><p class="note">管道、重定向、命令替换、本地文件读取和文件上传会被拒绝。分享输出前请移除凭据。</p></section>
  <section class="card"><div class="actions"><label for="target">输出目标</label><select id="target"><option value="fetch">JavaScript Fetch</option><option value="python">Python requests</option></select><button id="copy">复制输出</button></div><textarea id="output" readonly spellcheck="false"></textarea></section>
</main><script type="module" src="./src/app.js"></script></body>
</html>
