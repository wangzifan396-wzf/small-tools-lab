<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>curl → 代码</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e7eaf0; --muted:#9aa4b2; --accent:#6ea8fe; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--fg); padding:28px; }
  h1 { font-size:20px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 18px; font-size:13.5px; }
  textarea { width:100%; min-height:150px; resize:vertical; background:var(--panel); color:var(--fg);
    border:1px solid var(--line); border-radius:10px; padding:12px; font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; }
  .tabs { display:flex; gap:8px; margin:16px 0 8px; }
  .tab { background:transparent; color:var(--muted); border:1px solid var(--line); border-radius:8px; padding:7px 14px; cursor:pointer; font-size:13.5px; }
  .tab.on { color:var(--fg); border-color:var(--accent); }
  .out { position:relative; }
  .copy { position:absolute; top:10px; right:10px; z-index:2; padding:5px 11px; font-size:12px; }
  pre { margin:0; white-space:pre-wrap; word-break:break-word; min-height:140px; }
  .hint { color:var(--muted); font-size:12px; margin-top:6px; }
  button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
  .convert { background:var(--accent); color:#0b1020; border:0; border-radius:9px; padding:9px 16px; font-weight:600; cursor:pointer; font-size:14px; }
</style>
</head>
<body>
  <h1>curl → 代码</h1>
  <p class="sub">零依赖 · 把 curl 命令转成 JS <code>fetch</code> 与 Python <code>requests</code>。支持 -X / -H / -d / -u / -b / -k / -F。数据不出本机。</p>
  <label style="color:var(--muted);font-size:12.5px;">粘贴 curl 命令</label>
  <textarea id="in" placeholder='curl -X POST https://api.example.com/users -H "Content-Type: application/json" -d "{\"name\":\"bob\"}"'></textarea>
  <div class="bar" style="margin:14px 0;"><button class="convert" id="go">转换</button>
    <button class="ghost" id="clear">清空</button><span class="hint" id="stat"></span></div>
  <div class="tabs">
    <button class="tab on" data-t="js">JavaScript (fetch)</button>
    <button class="tab" data-t="py">Python (requests)</button>
  </div>
  <div class="out">
    <button class="ghost copy" id="copy">复制</button>
    <pre id="js" class="pane"></pre>
    <pre id="py" class="pane" style="display:none"></pre>
  </div>
  <script src="src/curlcon.js"></script>
  <script>
    var $ = function (id) { return document.getElementById(id); };
    var result = { js: '', py: '' };
    function convert() {
      var src = $('in').value;
      if (!src.trim()) { result = { js:'', py:'' }; render(); $('stat').textContent=''; return; }
      try {
        var c = CurlCon.convert(src);
        result = { js: c.js, py: c.python };
        render();
        $('stat').textContent = '方法 ' + (c.request.method || 'GET') + ' · ' + (c.request.url || '(无 URL)');
      } catch (e) { $('stat').textContent = '解析失败：' + e.message; }
    }
    function render() {
      $('js').textContent = result.js;
      $('py').textContent = result.py;
    }
    document.querySelectorAll('.tab').forEach(function (t) {
      t.onclick = function () {
        document.querySelectorAll('.tab').forEach(function (x) { x.classList.remove('on'); });
        t.classList.add('on');
        var which = t.dataset.t;
        $('js').style.display = which === 'js' ? '' : 'none';
        $('py').style.display = which === 'py' ? '' : 'none';
      };
    });
    $('go').onclick = convert;
    $('clear').onclick = function () { $('in').value=''; result={js:'',py:''}; render(); $('stat').textContent=''; };
    $('copy').onclick = function () {
      var txt = $('js').style.display !== 'none' ? result.js : result.py;
      navigator.clipboard.writeText(txt).then(function () { $('copy').textContent='已复制'; setTimeout(function(){ $('copy').textContent='复制'; },1200); });
    };
    $('in').value = 'curl -X POST https://api.example.com/v1/users \\\n  -H "Content-Type: application/json" \\\n  -H "Authorization: Bearer TOKEN" \\\n  -d \'{"name":"bob","age":30}\'';
    convert();
  </script>
</body>
</html>
