<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>diffwords · live playground</title>
  <style>
    :root {
      --bg: #0f1115; --panel: #171a21; --ink: #e7e9ee; --muted: #9aa3b2;
      --line: #262b36; --accent: #6ea8fe;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--ink);
           font: 14px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    header { padding: 18px 22px; border-bottom: 1px solid var(--line);
             display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
    header h1 { font-size: 18px; margin: 0; }
    header span { color: var(--muted); }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px 22px; }
    @media (max-width: 860px) { main { grid-template-columns: 1fr; } }
    textarea { width: 100%; min-height: 220px; resize: vertical; background: var(--panel);
               color: var(--ink); border: 1px solid var(--line); border-radius: 10px;
               padding: 12px; font: 13px/1.5 ui-monospace, Menlo, Consolas, monospace; }
    .bar { display: flex; gap: 8px; align-items: center; padding: 0 22px 8px; flex-wrap: wrap; }
    label, select, button { font-size: 13px; }
    select, button { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
                      border-radius: 8px; padding: 7px 12px; cursor: pointer; }
    button.primary { background: var(--accent); color: #08121f; border-color: var(--accent); font-weight: 600; }
    .panel { margin: 0 22px 22px; }
    .summary { font-family: ui-monospace, Menlo, Consolas, monospace; color: var(--muted); margin: 0 22px 8px; }
    iframe { width: 100%; height: 460px; border: 1px solid var(--line); border-radius: 10px; background: #0f1115; }
    h3 { margin: 0 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  </style>
  <!--
    file:// guard. A classic script keeps working when module scripts are
    blocked by CORS on the file: protocol — which is exactly what makes every
    button on the page look dead. Explain it instead of failing silently.
  -->
  <script>
    (function () {
      if (location.protocol !== 'file:') return;
      var CMD = 'node playground/serve.js';
      function show() {
        var box = document.createElement('div');
        box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;' +
          'justify-content:center;padding:24px;background:#faf9f7;color:#22211e;' +
          'font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif');
        box.innerHTML =
          '<div style="max-width:560px;background:#fff;border:1px solid #e7e4dd;border-radius:14px;' +
          'box-shadow:0 24px 60px -12px rgba(28,25,20,.18);padding:28px 30px">' +
          '<div style="font-size:28px;margin-bottom:10px">🔌</div>' +
          '<h1 style="margin:0 0 12px;font-size:20px;font-weight:640">请通过本地服务打开</h1>' +
          '<p style="margin:0 0 14px;color:#56534c">你现在是用 <code style="background:#f5f3ef;border:1px solid #e7e4dd;padding:2px 6px;border-radius:5px;font-size:12.5px">file://</code> 直接打开这个页面的。' +
          '浏览器会按同源策略拦截模块脚本，页面里的按钮因此<b>全部不会响应</b>。</p>' +
          '<ol style="margin:0 0 14px;padding-left:20px;color:#56534c">' +
          '<li>Windows：双击项目根目录的 <b>start.cmd</b></li>' +
          '<li>macOS / Linux：终端执行 <b>./start.sh</b></li>' +
          '<li>或手动运行：<code id="fg-cmd" style="background:#f5f3ef;border:1px solid #e7e4dd;padding:2px 6px;border-radius:5px;font-size:12.5px">' + CMD + '</code>' +
          ' <button id="fg-copy" type="button" style="font-size:12px;padding:3px 9px;margin-left:6px;border-radius:6px;border:1px solid #e7e4dd;background:#f3f1ec;color:#56534c;cursor:pointer">复制</button></li>' +
          
          '</ol>' +
          '<p style="margin:0;font-size:13px;color:#8b877e">启动后访问 <b>http://localhost:4173</b> 即可正常使用。</p>' +
          '</div>';
        document.body.appendChild(box);
        var b = document.getElementById('fg-copy');
        if (b) b.onclick = function () {
          try { navigator.clipboard.writeText(CMD); b.textContent = '已复制'; }
          catch (e) { b.textContent = '请手动复制'; }
        };
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
      else show();
    })();
  </script>
</head>
<body>
  <header>
    <h1>diffwords</h1>
    <span>word-level, CJK-aware text differ — runs entirely in your browser</span>
  </header>

  <main>
    <section>
      <h3>Original (a)</h3>
      <textarea id="a" spellcheck="false"></textarea>
    </section>
    <section>
      <h3>Revised (b)</h3>
      <textarea id="b" spellcheck="false"></textarea>
    </section>
  </main>

  <div class="bar">
    <label>mode
      <select id="mode">
        <option value="inline">inline</option>
        <option value="side" selected>side-by-side</option>
      </select>
    </label>
    <button class="primary" id="render">Diff</button>
    <button id="sample">Load sample</button>
  </div>

  <p class="summary" id="summary">—</p>
  <div class="panel">
    <iframe id="preview" title="diff preview"></iframe>
  </div>

  <script type="module">
    import { diff, formatHtml } from '../src/index.js';

    const $ = (id) => document.getElementById(id);
    const A = `The quick brown fox jumps over the lazy dog.
We shipped the feature last week and it worked well.
Please review the documentation before the release.`;
    const B = `The quick brown fox leaps over the lazy dog.
We shipped the feature last week and it worked great.
Please review the documentation before the final release.`;

    function render() {
      const a = $('a').value;
      const b = $('b').value;
      const mode = $('mode').value;
      const result = diff(a, b);
      const s = result.stats;
      $('summary').textContent =
        `tokens ${s.total} · +${s.added} added · -${s.removed} removed · ${(s.similarity * 100).toFixed(1)}% similar`;
      $('preview').srcdoc = formatHtml(result, { mode, title: 'diffwords' });
    }

    $('render').addEventListener('click', render);
    $('sample').addEventListener('click', () => { $('a').value = A; $('b').value = B; render(); });
    $('a').value = A;
    $('b').value = B;
    render();
  </script>
</body>
</html>
