<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>passphrase · 助记词口令生成</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --border: #e7e4dd; --border-strong: #d8d4ca;
    --text: #22211e; --text-2: #56534c; --muted: #8b877e;
    --accent: #6a5acd; --accent-soft: #ece9f9; --ok: #3d8f61; --warn: #c0792b; --bad: #c0392b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14; --panel: #151922; --border: #232b3a; --border-strong: #34415a;
      --text: #e9edf5; --text-2: #aab3c6; --muted: #6e788e;
      --accent: #9d8cff; --accent-soft: #1d1a2e; --ok: #5fd0a0; --warn: #f0b269; --bad: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 28px 16px;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 760px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  label { font-size: 13px; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
  input[type=number], input[type=text], select {
    padding: 9px 11px; border-radius: var(--r); border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px; font-family: var(--mono);
  }
  input[type=number] { width: 70px; }
  button {
    padding: 9px 16px; border-radius: var(--r); border: 1px solid transparent; cursor: pointer;
    font-size: 14px; background: var(--accent); color: #fff;
  }
  button.ghost { background: transparent; color: var(--accent); border-color: var(--border-strong); }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; margin-top: 14px; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .out {
    font-family: var(--mono); font-size: 18px; font-weight: 700; word-break: break-all;
    background: var(--accent-soft); border-radius: 10px; padding: 12px 14px; color: var(--text);
  }
  .stat-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
  .stat { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; flex: 1; min-width: 120px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 15px; font-weight: 700; font-family: var(--mono); }
  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔐 passphrase · 助记词口令生成</h1>
  <p class="sub">用 <strong>diceware</strong> 思路从 256 词表中随机抽取若干词拼成易记且高熵的口令。<strong>纯前端运行，零依赖，不上传任何数据。</strong></p>

  <div class="row">
    <label>词数 <input id="words" type="number" min="2" max="16" value="6" /></label>
    <label>分隔符 <input id="sep" type="text" value="-" maxlength="3" style="width:64px" /></label>
    <label><input id="cap" type="checkbox" /> 首字母大写</label>
    <label><input id="num" type="checkbox" /> 末尾加数字</label>
    <button id="gen">生成</button>
    <button id="regen" class="ghost">再生成一次</button>
  </div>

  <div class="card">
    <p class="label">口令</p>
    <div class="out" id="out">—</div>
    <div class="stat-row">
      <div class="stat"><div class="k">熵估值</div><div class="v" id="bits">—</div></div>
      <div class="stat"><div class="k">强度</div><div class="v" id="strength">—</div></div>
      <div class="stat"><div class="k">可用词数</div><div class="v" id="pool">—</div></div>
    </div>
    <div class="btns">
      <button id="copy" class="ghost">复制</button>
    </div>
  </div>

  <p class="foot">diceware · 256 词表 · 词数 × log₂(256) 位熵 · 零依赖</p>
</div>

<script src="src/index.js"></script>
<script>
  const T = window.PassphraseTool;
  const $ = (id) => document.getElementById(id);
  function render() {
    const opts = {
      words: parseInt($('words').value, 10),
      separator: $('sep').value,
      capitalize: $('cap').checked,
      includeNumber: $('num').checked,
    };
    const pass = T.generate(opts);
    $('out').textContent = pass;
    const bits = T.entropyBits(opts.words + (opts.includeNumber ? 0 : 0));
    $('bits').textContent = bits + ' 位';
    $('strength').textContent = T.strengthLabel(bits);
    $('pool').textContent = T.WORDS.length;
  }
  function copy() {
    const t = $('out').textContent;
    if (navigator.clipboard) navigator.clipboard.writeText(t).then(() => flash());
    else flash();
  }
  function flash() { const b = $('copy'); const o = b.textContent; b.textContent = '已复制'; setTimeout(() => (b.textContent = o), 1000); }
  $('gen').addEventListener('click', render);
  $('regen').addEventListener('click', render);
  $('copy').addEventListener('click', copy);
  render();
</script>
</body>
</html>
