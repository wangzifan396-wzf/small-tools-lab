<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CSV ⇄ JSON · 表格转换</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --border: #e7e4dd; --text: #22211e; --text-2: #56534c;
    --muted: #8b877e; --accent: #bf5b38; --accent-soft: #f8ece7; --ok: #3d8f61; --err: #c0392b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14; --panel: #151922; --border: #232b3a; --text: #e9edf5; --text-2: #aab3c6;
      --muted: #6e788e; --accent: #ff7a59; --accent-soft: #2a1d18; --ok: #5fd0a0; --err: #ff8b8b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 28px 16px; display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 820px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; margin-top: 12px; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  textarea {
    width: 100%; min-height: 170px; padding: 12px 13px; border-radius: var(--r);
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-family: var(--mono); font-size: 13px; line-height: 1.6; resize: vertical;
  }
  select, input[type=text] {
    padding: 9px 12px; border-radius: var(--r); border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 13px;
  }
  label.chk { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); cursor: pointer; }
  button {
    padding: 9px 16px; border-radius: var(--r); border: 1px solid transparent;
    background: var(--accent); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  button:hover { filter: brightness(1.05); }
  button.ghost { background: var(--panel); color: var(--text-2); border: 1px solid var(--border); }
  .ops { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  #msg { margin-top: 10px; font-size: 13px; }
  #msg.err { color: var(--err); }
  #msg.ok { color: var(--ok); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <h1>📑 CSV ⇄ JSON · 表格转换</h1>
  <p class="sub">在 CSV 与 JSON 之间互转，正确处理带引号 / 逗号 / 换行的字段。纯前端，数据不出本机。</p>

  <div class="card">
    <div class="row">
      <label class="chk">方向
        <select id="dir">
          <option value="csv2json">CSV → JSON</option>
          <option value="json2csv">JSON → CSV</option>
        </select>
      </label>
      <label class="chk">分隔符
        <select id="delim">
          <option value="auto">自动</option>
          <option value=",">逗号 ,</option>
          <option value=";">分号 ;</option>
          <option value="tab">制表符 Tab</option>
          <option value="|">竖线 |</option>
        </select>
      </label>
      <label class="chk" id="headerWrap"><input type="checkbox" id="header" checked /> 首行作为表头</label>
    </div>
    <div class="ops">
      <button id="go">转换</button>
      <button id="copy" class="ghost">复制结果</button>
      <button id="sample" class="ghost">示例</button>
    </div>
    <div id="msg"></div>
  </div>

  <div class="card">
    <div class="label">输入</div>
    <textarea id="in" spellcheck="false" placeholder="在此粘贴 CSV 或 JSON…"></textarea>
  </div>

  <div class="card">
    <div class="label">输出</div>
    <textarea id="out" spellcheck="false" readonly placeholder="转换结果将显示在这里…"></textarea>
  </div>

  <p class="foot">零依赖 · 纯前端 · 数据不出本机</p>
</div>
<script>
function detectDelim(text) {
  var firstLine = (text.split(/\r?\n/)[0] || "");
  var cands = [",", ";", "\t", "|"];
  var best = ",", bestCount = -1;
  for (var i = 0; i < cands.length; i++) {
    var d = cands[i];
    var count = firstLine.split(d).length - 1;
    if (count > bestCount) { bestCount = count; best = d; }
  }
  return best;
}
// RFC4180-ish parser: handles quoted fields, embedded commas/newlines/quotes.
function parseCSV(text, delim) {
  var rows = [], row = [], field = "", i = 0;
  var n = text.length;
  while (i < n) {
    var c = text[i];
    if (c === '"') {
      if (i + 1 < n && text[i + 1] === '"') { field += '"'; i += 2; continue; }
      var j = i + 1, buf = "";
      while (j < n) {
        if (text[j] === '"') {
          if (j + 1 < n && text[j + 1] === '"') { buf += '"'; j += 2; continue; }
          break;
        }
        buf += text[j]; j++;
      }
      field += buf; i = j + 1; continue;
    }
    if (c === delim) { row.push(field); field = ""; i++; continue; }
    if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; i++; continue; }
    if (c === "\r") { i++; continue; }
    field += c; i++;
  }
  if (field !== "" || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function csvEscape(val, delim) {
  var s = val == null ? "" : String(val);
  if (/["\n\r]/.test(s) || s.indexOf(delim) !== -1) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function isBlank(row) { return row.every(function (c) { return (c || "").trim() === ""; }); }

function csvToJson(text, delim, useHeader) {
  var rows = parseCSV(text, delim).filter(function (r) { return !isBlank(r); });
  if (!rows.length) return "[]";
  if (!useHeader) return JSON.stringify(rows, null, 2);
  var head = rows[0];
  var out = [];
  for (var k = 1; k < rows.length; k++) {
    var obj = {};
    for (var h = 0; h < head.length; h++) obj[head[h]] = rows[k][h] !== undefined ? rows[k][h] : "";
    out.push(obj);
  }
  return JSON.stringify(out, null, 2);
}
function jsonToCsv(text, delim) {
  var data = JSON.parse(text);
  if (!Array.isArray(data)) data = [data];
  if (!data.length) return "";
  // array of arrays → direct
  if (Array.isArray(data[0])) {
    return data.map(function (r) { return r.map(function (c) { return csvEscape(c, delim); }).join(delim); }).join("\n");
  }
  // array of objects → union keys in first-seen order
  var keys = [];
  data.forEach(function (o) {
    if (o && typeof o === "object") Object.keys(o).forEach(function (k) { if (keys.indexOf(k) === -1) keys.push(k); });
  });
  var lines = [keys.map(function (k) { return csvEscape(k, delim); }).join(delim)];
  data.forEach(function (o) {
    lines.push(keys.map(function (k) { return csvEscape(o ? o[k] : "", delim); }).join(delim));
  });
  return lines.join("\n");
}
function run() {
  var msg = document.getElementById("msg");
  var out = document.getElementById("out");
  msg.className = ""; msg.textContent = "";
  var text = document.getElementById("in").value;
  if (!text.trim()) { out.value = ""; msg.className = "err"; msg.textContent = "请输入内容"; return; }
  var dir = document.getElementById("dir").value;
  var delim = document.getElementById("delim").value;
  if (delim === "auto") delim = detectDelim(text);
  else if (delim === "tab") delim = "\t";
  try {
    if (dir === "csv2json") {
      out.value = csvToJson(text, delim, document.getElementById("header").checked);
    } else {
      out.value = jsonToCsv(text, delim);
    }
    msg.className = "ok"; msg.textContent = "转换成功";
  } catch (e) {
    out.value = "";
    msg.className = "err"; msg.textContent = "转换失败：" + e.message;
  }
}
function copy() {
  var v = document.getElementById("out").value;
  if (!v) return;
  navigator.clipboard.writeText(v).then(function () {
    var m = document.getElementById("msg"); m.className = "ok"; m.textContent = "已复制结果";
  }).catch(function () { alert(v); });
}
document.getElementById("go").onclick = run;
document.getElementById("copy").onclick = copy;
document.getElementById("sample").onclick = function () {
  document.getElementById("dir").value = "csv2json";
  document.getElementById("delim").value = "auto";
  document.getElementById("header").checked = true;
  document.getElementById("in").value =
    'name,age,city,note\nAlice,30,"New York","likes \"code\", coffee"\nBob,25,Beijing,中文备注\nCharles,41,"San Francisco",multi\nline text';
  run();
};
// Hide the header checkbox in JSON→CSV mode where it doesn't apply.
document.getElementById("dir").addEventListener("change", function () {
  document.getElementById("headerWrap").style.display = this.value === "csv2json" ? "" : "none";
});
</script>
</body>
</html>
