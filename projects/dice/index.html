<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>dice · 随机数 / 掷骰 / 抽奖</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --panel-2: #f3f1ec; --border: #e7e4dd; --border-strong: #d8d4ca;
    --text: #22211e; --text-2: #56534c; --muted: #8b877e;
    --accent: #6a5acd; --accent-soft: #ece9f9; --ok: #3d8f61; --warn: #c0792b; --bad: #c0392b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14; --panel: #151922; --panel-2: #1b2230; --border: #232b3a; --border-strong: #34415a;
      --text: #e9edf5; --text-2: #aab3c6; --muted: #6e788e;
      --accent: #9d8cff; --accent-soft: #1d1a2e; --ok: #5fd0a0; --warn: #f0b269; --bad: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; padding: 28px 16px; display: flex; justify-content: center; }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 18px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab { padding: 7px 14px; border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--muted); cursor: pointer; font-size: 13px; }
  .tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .field { margin-bottom: 14px; }
  label { display: block; font-size: 13px; color: var(--text-2); margin-bottom: 6px; }
  input[type=number], input[type=text], textarea { width: 100%; padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--border); background: var(--panel-2); color: var(--text); font-family: var(--mono); font-size: 14px; }
  textarea { min-height: 80px; resize: vertical; }
  input:focus, textarea:focus { outline: none; border-color: var(--accent); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .mini { padding: 9px 16px; border-radius: 8px; border: 1px solid var(--border); background: var(--panel-2); color: var(--text); cursor: pointer; font-size: 13px; }
  .mini:hover { border-color: var(--accent); color: var(--accent); }
  .dice-row { font-size: 40px; letter-spacing: 8px; text-align: center; margin: 10px 0; min-height: 48px; }
  .out { margin-top: 8px; padding: 14px 16px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid var(--border); font-family: var(--mono); font-size: 16px; word-break: break-all; white-space: pre-wrap; min-height: 52px; }
  .err { color: var(--bad); font-size: 13px; min-height: 18px; margin-top: 6px; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 12px; line-height: 1.7; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎲 dice · 随机数 / 掷骰 / 抽奖</h1>
  <p class="sub">密码学安全的随机：掷多面骰、取整数区间、不重复抽奖。纯前端、零依赖。</p>
  <div class="card">
    <div class="tabs">
      <button class="tab active" data-mode="dice">掷骰</button>
      <button class="tab" data-mode="num">随机整数</button>
      <button class="tab" data-mode="lot">抽奖</button>
    </div>

    <div id="dice-pane">
      <div class="row">
        <span style="font-size:13px;color:var(--text-2)">骰子面数</span>
        <input type="number" id="sides" value="6" min="2" max="1000" style="max-width:110px" />
        <span style="font-size:13px;color:var(--text-2)">颗数</span>
        <input type="number" id="count" value="2" min="1" max="20" style="max-width:90px" />
        <button class="mini" id="roll">掷!</button>
      </div>
      <div class="dice-row" id="diceFace">🎲</div>
    </div>

    <div id="num-pane" class="hide">
      <div class="row">
        <span style="font-size:13px;color:var(--text-2)">下限</span>
        <input type="number" id="lo" value="1" style="max-width:120px" />
        <span style="font-size:13px;color:var(--text-2)">上限（含）</span>
        <input type="number" id="hi" value="100" style="max-width:120px" />
        <button class="mini" id="genNum">生成</button>
      </div>
    </div>

    <div id="lot-pane" class="hide">
      <div class="field">
        <label>候选名单（每行一个）</label>
        <textarea id="names" spellcheck="false">张三
李四
王五
赵六
钱七</textarea>
      </div>
      <div class="row">
        <span style="font-size:13px;color:var(--text-2)">抽取人数</span>
        <input type="number" id="pick" value="1" min="1" max="100" style="max-width:90px" />
        <label class="chk" style="font-size:13px"><input type="checkbox" id="unique" checked /> 不重复</label>
        <button class="mini" id="draw">抽奖</button>
      </div>
    </div>

    <div class="out" id="out">—</div>
    <div class="err" id="err"></div>
    <div class="hint">随机来源为浏览器 <code>crypto.getRandomValues</code>（密码学安全），不依赖 <code>Math.random</code>。</div>
  </div>
  <p class="foot">纯前端 · 数据不出本机</p>
</div>

<script>
"use strict";
const $ = (id) => document.getElementById(id);
const FACES = { 4: "🔹", 6: "🎲", 8: "🔶", 10: "🔟", 12: "🔷", 20: "⭐", 100: "💯" };

function randBelow(n) {
  // 拒绝采样，保证均匀分布且密码学安全
  const max = Math.floor(0x100000000 / n) * n;
  let x;
  do { x = crypto.getRandomValues(new Uint32Array(1))[0]; } while (x >= max);
  return x % n;
}
function randInt(lo, hi) { return lo + randBelow(hi - lo + 1); }

function setMode(mode) {
  document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("active", t.dataset.mode === mode));
  $("dice-pane").classList.toggle("hide", mode !== "dice");
  $("num-pane").classList.toggle("hide", mode !== "num");
  $("lot-pane").classList.toggle("hide", mode !== "lot");
}

function roll() {
  const sides = Math.max(2, Math.min(1000, +$("sides").value || 6));
  const n = Math.max(1, Math.min(20, +$("count").value || 1));
  const res = [];
  for (let i = 0; i < n; i++) res.push(randInt(1, sides));
  $("out").textContent = res.join(", ") + `  （合计 ${res.reduce((a, b) => a + b, 0)}）`;
  $("diceFace").textContent = FACES[sides] || "🎲";
}

function genNum() {
  const lo = +$("lo").value, hi = +$("hi").value;
  if (hi < lo) { $("err").textContent = "上限需 ≥ 下限"; return; }
  $("err").textContent = "";
  $("out").textContent = String(randInt(lo, hi));
}

function draw() {
  const list = $("names").value.split("\n").map((s) => s.trim()).filter(Boolean);
  const k = Math.max(1, Math.min(list.length, +$("pick").value || 1));
  const pool = $("unique").checked ? list.slice() : list.slice();
  const picked = [];
  for (let i = 0; i < k && pool.length; i++) {
    const idx = randBelow(pool.length);
    picked.push(pool[idx]);
    if ($("unique").checked) pool.splice(idx, 1);
    else if (pool.length > 1) pool.splice(idx, 1);
  }
  $("out").textContent = picked.join("\n");
}

document.querySelectorAll(".tab").forEach((t) => (t.onclick = () => setMode(t.dataset.mode)));
$("roll").onclick = roll;
$("genNum").onclick = genNum;
$("draw").onclick = draw;
roll();
</script>
</body>
</html>
