<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>jsonfmt · JSON 格式化 / 校验</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --border: #e7e4dd; --border-strong: #d8d4ca;
    --text: #22211e; --text-2: #56534c; --muted: #8b877e;
    --accent: #6a5acd; --accent-soft: #ece9f9; --ok: #3d8f61; --warn: #c0792b; --bad: #c0392b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14; --panel: #151922; --border: #232b3a; --border-strong: #34415a;
      --text: #e9edf5; --text-2: #aab3c6; --muted: #6e788e;
      --accent: #9d8cff; --accent-soft: #1d1a2e; --ok: #5fd0a0; --warn: #f0b269; --bad: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 28px 16px;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 760px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  button {
    padding: 10px 14px; border-radius: var(--r); border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px; cursor: pointer;
  }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; font-weight: 600; }
  button.primary:hover { filter: brightness(1.06); }
  textarea {
    width: 100%; min-height: 200px; box-sizing: border-box; resize: vertical;
    padding: 12px 14px; border-radius: var(--r); border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px; font-family: var(--mono); line-height: 1.55;
  }
  textarea:focus { outline: none; border-color: var(--accent); }
  .field { margin-top: 14px; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .err { font-size: 13px; margin-top: 8px; min-height: 18px; }
  .err.ok { color: var(--ok); }
  .err.bad { color: var(--bad); }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧾 jsonfmt · JSON 格式化 / 校验</h1>
  <p class="sub">粘贴混乱的 JSON，一键<strong>格式化、压缩或校验</strong>。纯前端运行，零依赖。</p>

  <div class="row">
    <button class="primary" id="format">格式化（美化）</button>
    <button id="minify">压缩（单行）</button>
    <button id="validate">仅校验</button>
    <button id="copy">复制结果</button>
    <button id="sample">载入示例</button>
  </div>

  <div class="field">
    <p class="label">输入</p>
    <textarea id="input" placeholder='{"name":"agenite","tools":[1,2,3]}'></textarea>
  </div>
  <div class="field">
    <p class="label">输出</p>
    <textarea id="output" readonly placeholder="结果将显示在这里…"></textarea>
  </div>
  <div class="err" id="err"></div>

  <p class="foot">JSON.parse / stringify · 零依赖 · 数据不出本机</p>
</div>

<script>
"use strict";
const $=(id)=>document.getElementById(id);
function parse(){
  const raw=$('input').value;
  if(!raw.trim()) throw new Error("输入为空");
  return JSON.parse(raw);
}
function setErr(msg, kind){
  const e=$('err'); e.textContent=msg; e.className="err " + (kind||"");
}
function flash(msg){
  setErr(msg, "ok");
  setTimeout(()=>{ if($('err').textContent===msg) $('err').textContent=""; }, 1400);
}
function format(){
  try{ const obj=parse(); $('output').value=JSON.stringify(obj, null, 2); setErr("✓ 合法 JSON，已美化", "ok"); }
  catch(e){ $('output').value=""; setErr("✗ " + (e && e.message ? e.message : e), "bad"); }
}
function minify(){
  try{ const obj=parse(); $('output').value=JSON.stringify(obj); setErr("✓ 合法 JSON，已压缩", "ok"); }
  catch(e){ $('output').value=""; setErr("✗ " + (e && e.message ? e.message : e), "bad"); }
}
function validate(){
  try{ parse(); setErr("✓ 合法的 JSON", "ok"); }
  catch(e){ setErr("✗ " + (e && e.message ? e.message : e), "bad"); }
}
function copy(){
  const v=$('output').value; if(!v) return;
  if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v).then(()=>flash("已复制"), ()=>fallback(v));
  else fallback(v);
}
function fallback(v){
  const t=$('output'); t.removeAttribute("readonly"); t.select();
  try{ document.execCommand("copy"); flash("已复制"); }catch(e){ flash("复制失败，请手动选择"); }
  t.setAttribute("readonly","");
}
function sample(){
  $('input').value='{"agent":"Agenite","localFirst":true,"tools":["write_file","run_command","web_fetch"],"mcp":{"count":12,"readonly":true}}';
  format();
}
$('format').addEventListener("click", format);
$('minify').addEventListener("click", minify);
$('validate').addEventListener("click", validate);
$('copy').addEventListener("click", copy);
$('sample').addEventListener("click", sample);
$('input').addEventListener("input", ()=>setErr(""));
</script>
</body>
</html>
