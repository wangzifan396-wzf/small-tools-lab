<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Inspect JSON structure and generate schemas locally in the browser.">
    <meta name="theme-color" content="#f5f6f3">
    <title>Schema Scout</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="src/schema.js" defer></script>
    <script src="src/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#workspace">Skip to workspace</a>
    <header class="app-header">
      <a class="brand" href="index.html" aria-label="Schema Scout home">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
        <span>Schema Scout</span>
      </a>
      <div class="header-actions">
        <span class="privacy-status"><i></i>Local only</span>
        <a class="icon-button" href="README.md" aria-label="Open project readme" title="Project readme">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/></svg>
        </a>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Use dark theme" title="Toggle theme">
          <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main id="workspace">
      <section class="input-pane" aria-labelledby="input-title">
        <div class="pane-heading">
          <div>
            <span class="step">01 / INPUT</span>
            <h1 id="input-title">JSON source</h1>
          </div>
          <div class="toolbar">
            <input id="file-input" type="file" accept="application/json,.json" hidden>
            <button class="button" id="upload-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5M12 3v12"/></svg>
              Open
            </button>
            <button class="button" id="sample-button" type="button">Sample</button>
          </div>
        </div>
        <div class="editor-shell" id="drop-zone">
          <div class="editor-gutter" id="line-numbers" aria-hidden="true">1</div>
          <textarea id="json-input" aria-label="JSON source" spellcheck="false" wrap="off"></textarea>
          <div class="drop-overlay" aria-hidden="true">Drop JSON</div>
        </div>
        <div class="editor-status">
          <span id="parse-status" class="status-ready"><i></i>Ready</span>
          <span id="source-size">0 B</span>
        </div>
        <div class="input-actions">
          <label class="root-name">Root name <input id="root-name" value="Dataset" maxlength="40" spellcheck="false"></label>
          <button class="button primary" id="analyze-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 16 4-5 4 3 5-7"/></svg>
            Analyze
          </button>
        </div>
      </section>

      <section class="report-pane" aria-labelledby="report-title">
        <div class="pane-heading report-heading">
          <div>
            <span class="step">02 / REPORT</span>
            <h2 id="report-title">Structure report</h2>
          </div>
          <label class="search-box">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="field-search" type="search" placeholder="Filter paths" aria-label="Filter field paths">
          </label>
        </div>

        <div class="stats-grid" id="stats-grid" aria-live="polite">
          <div><span>Records</span><strong id="stat-records">-</strong></div>
          <div><span>Fields</span><strong id="stat-fields">-</strong></div>
          <div><span>Max depth</span><strong id="stat-depth">-</strong></div>
          <div><span>Null values</span><strong id="stat-nulls">-</strong></div>
        </div>

        <div class="field-table-wrap">
          <table class="field-table">
            <thead><tr><th>Field path</th><th>Detected type</th><th>Coverage</th><th>Example</th></tr></thead>
            <tbody id="field-rows"></tbody>
          </table>
          <div class="table-empty" id="table-empty">No fields</div>
        </div>

        <div class="output-heading">
          <div class="tabs" role="tablist" aria-label="Generated output">
            <button type="button" role="tab" aria-selected="true" data-format="schema">JSON Schema</button>
            <button type="button" role="tab" aria-selected="false" tabindex="-1" data-format="typescript">TypeScript</button>
            <button type="button" role="tab" aria-selected="false" tabindex="-1" data-format="catalog">Path catalog</button>
          </div>
          <div class="toolbar">
            <button class="button compact" id="copy-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              Copy
            </button>
            <button class="button compact primary" id="download-button" type="button">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5M12 15V3"/></svg>
              Download
            </button>
          </div>
        </div>
        <pre class="code-output" id="code-output" tabindex="0">// Analyze JSON to generate output</pre>
      </section>
    </main>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
