<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
  <title>ULID Toolkit · Small Tools Lab</title>
  <style>
    :root{--bg:#f5f6f3;--card:#fff;--text:#20231f;--muted:#6c746b;--line:#dfe4dc;--accent:#21766f;--bad:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:860px;margin:auto;padding:32px 20px 60px}h1{margin:0;font-size:26px}.sub{color:var(--muted);margin:5px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}input[type=text],input[type=number]{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;background:#fbfcfa;font:14px ui-monospace,monospace}.row{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.row>label:first-child{flex:1;min-width:240px}.check{color:var(--text);white-space:nowrap;margin:0 5px 9px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 14px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.value{margin-top:14px;border:1px solid var(--line);border-radius:9px;background:#f1f5f2;padding:12px;word-break:break-all;font:17px ui-monospace,monospace}.details{display:grid;grid-template-columns:1fr;gap:8px;margin-top:12px}.details div{display:grid;grid-template-columns:130px 1fr;gap:10px}.details span{color:var(--muted)}.details code{word-break:break-all}.error{min-height:24px;color:var(--bad);margin-top:8px}
  </style>
</head>
<body><main class="wrap"><h1>ULID Toolkit</h1><p class="sub">规范严格的 ULID 生成与解析，使用 Web Crypto，并支持单调排序模式。</p>
  <section class="card"><div class="row"><label>时间戳（毫秒，留空使用当前时间）<input id="timestamp" type="number" min="0" max="281474976710655" placeholder="Date.now()"></label><label class="check"><input id="monotonic" type="checkbox" checked> 单调模式</label></div><div class="actions"><button class="primary" id="generate">生成</button><button id="copy">复制</button></div><div class="value" id="generated" aria-live="polite"></div></section>
  <section class="card"><label for="decode-input">解析 ULID</label><input id="decode-input" type="text" maxlength="26" spellcheck="false"><div class="actions"><button class="primary" id="decode">解析</button></div><div class="details"><div><span>Canonical</span><code id="canonical"></code></div><div><span>Timestamp</span><code id="decoded-time"></code></div><div><span>Randomness (hex)</span><code id="randomness"></code></div></div></section><div class="error" id="error" role="alert"></div>
</main><script type="module" src="./src/app.js"></script></body>
</html>
