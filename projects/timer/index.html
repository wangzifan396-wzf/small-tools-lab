<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>计时器 · small-tools-lab</title>
<style>
  :root { --bg:#0f1115; --panel:#171a21; --panel2:#1f232c; --border:#2a2f3a; --text:#e6e9ef; --muted:#9aa3b2; --accent:#6ea8fe; --ok:#4ade80; --bad:#f87171; --warn:#fbbf24; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 ui-sans-serif,system-ui,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); padding:22px; }
  h1 { font-size:18px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 18px; font-size:13px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { background:var(--panel); border:1px solid var(--border); color:var(--muted); border-radius:8px; padding:7px 16px; cursor:pointer; }
  .tab.active { background:var(--accent); color:#0b1020; border-color:var(--accent); font-weight:600; }
  .panel { display:none; }
  .panel.active { display:block; }
  .display { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:56px; font-weight:700; text-align:center; letter-spacing:2px; margin:10px 0; }
  .display.done { color:var(--bad); }
  .ctrls { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
  button { background:var(--accent); color:#0b1020; border:0; border-radius:8px; padding:10px 18px; font-weight:600; cursor:pointer; font-size:14px; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--border); font-weight:500; }
  button.danger { background:var(--bad); color:#1a0a0a; }
  .row { display:flex; gap:10px; justify-content:center; margin-bottom:8px; }
  input[type=number] { width:90px; background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:9px; text-align:center; font-family:ui-monospace,monospace; font-size:18px; }
  input:focus { outline:none; border-color:var(--accent); }
  .tip { color:var(--muted); font-size:12px; margin-top:16px; text-align:center; }
</style>
</head>
<body>
  <h1>计时器</h1>
  <p class="sub">倒计时与秒表，纯前端、零依赖，不依赖系统时钟精度以外的任何东西。</p>

  <div class="tabs">
    <div class="tab active" data-tab="countdown">⏳ 倒计时</div>
    <div class="tab" data-tab="stopwatch">⏱️ 秒表</div>
  </div>

  <div class="panel active" id="countdown">
    <div class="row">
      <input id="cd-min" type="number" value="5" min="0" max="599" placeholder="分" />
      <span style="align-self:center;font-size:22px;">:</span>
      <input id="cd-sec" type="number" value="0" min="0" max="59" placeholder="秒" />
    </div>
    <div class="display" id="cd-display">05:00</div>
    <div class="ctrls">
      <button id="cd-start">开始</button>
      <button class="ghost" id="cd-pause">暂停</button>
      <button class="danger" id="cd-reset">重置</button>
    </div>
  </div>

  <div class="panel" id="stopwatch">
    <div class="display" id="sw-display">00:00.0</div>
    <div class="ctrls">
      <button id="sw-start">开始</button>
      <button class="ghost" id="sw-lap">计次</button>
      <button class="danger" id="sw-reset">重置</button>
    </div>
    <div id="sw-laps" style="margin-top:14px;font-family:ui-monospace,monospace;font-size:13px;color:var(--muted);"></div>
  </div>

  <p class="tip">倒计时归零会闪红提示；秒表可多次「计次」记录单圈用时。</p>

<script>
(function () {
  const $ = (id) => document.getElementById(id);

  // tab switching
  document.querySelectorAll('.tab').forEach((t) => {
    t.onclick = () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('active'));
      document.querySelectorAll('.panel').forEach((x) => x.classList.remove('active'));
      t.classList.add('active');
      $('' + t.dataset.tab).classList.add('active');
    };
  });

  // ---- Countdown ----
  let cdTotal = 0, cdRemain = 0, cdTimer = null, cdRunning = false;
  function fmt(ms) {
    const s = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(s / 60), sec = s % 60;
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }
  function cdRender() { $('cd-display').textContent = fmt(cdRemain); }
  function cdSet() {
    const m = parseInt($('cd-min').value, 10) || 0, s = parseInt($('cd-sec').value, 10) || 0;
    cdTotal = (m * 60 + s) * 1000; cdRemain = cdTotal; $('cd-display').classList.remove('done'); cdRender();
  }
  $('cd-start').onclick = () => {
    if (cdRunning) return;
    if (cdRemain <= 0) cdSet();
    cdRunning = true;
    const end = Date.now() + cdRemain;
    cdTimer = setInterval(() => {
      cdRemain = end - Date.now();
      if (cdRemain <= 0) {
        cdRemain = 0; cdRender();
        clearInterval(cdTimer); cdRunning = false;
        $('cd-display').classList.add('done');
        $('cd-display').textContent = '时间到!';
        return;
      }
      cdRender();
    }, 200);
  };
  $('cd-pause').onclick = () => { if (cdTimer) clearInterval(cdTimer); cdRunning = false; };
  $('cd-reset').onclick = () => { if (cdTimer) clearInterval(cdTimer); cdRunning = false; cdSet(); };
  ['cd-min','cd-sec'].forEach((id) => $(id).addEventListener('change', () => { if (!cdRunning) cdSet(); }));
  cdSet();

  // ---- Stopwatch ----
  let swElapsed = 0, swTimer = null, swRunning = false, swStart = 0, lapNo = 0, lastLap = 0;
  function swFmt(ms) {
    const t = Math.max(0, ms);
    const m = Math.floor(t / 60000), s = Math.floor((t % 60000) / 1000), d = Math.floor((t % 1000) / 100);
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0') + '.' + d;
  }
  function swRender() { $('sw-display').textContent = swFmt(swElapsed); }
  $('sw-start').onclick = () => {
    if (swRunning) { clearInterval(swTimer); swRunning = false; $('sw-start').textContent = '继续'; return; }
    swRunning = true; $('sw-start').textContent = '暂停'; swStart = Date.now() - swElapsed;
    swTimer = setInterval(() => { swElapsed = Date.now() - swStart; swRender(); }, 50);
  };
  $('sw-lap').onclick = () => {
    if (!swRunning && swElapsed === 0) return;
    lapNo++; const cur = swElapsed; const diff = cur - lastLap; lastLap = cur;
    const div = document.createElement('div');
    div.textContent = `计次 ${lapNo}: 总 ${swFmt(cur)}  ·  本圈 ${swFmt(diff)}`;
    $('sw-laps').prepend(div);
  };
  $('sw-reset').onclick = () => {
    if (swTimer) clearInterval(swTimer); swRunning = false; swElapsed = 0; lastLap = 0; lapNo = 0; $('sw-display').textContent = '00:00.0'; $('sw-start').textContent = '开始'; $('sw-laps').innerHTML = '';
  };
  swRender();
})();
</script>
</body>
</html>
