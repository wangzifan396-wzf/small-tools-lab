<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Regex Visualizer · 正则可视化</title>
  <style>
    :root { --bg:#f4f6f7; --surface:#fff; --border:#d8dee2; --text:#17201d; --muted:#60706a; --accent:#176b52; --amber:#fff0bd; --danger:#b42318; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); }
    .wrap { width:min(940px,calc(100% - 36px)); margin:36px auto; }
    h1 { margin:0; font-size:24px; }
    .sub { margin:4px 0 22px; color:var(--muted); }
    .tool { padding:20px; border:1px solid var(--border); border-radius:8px; background:var(--surface); box-shadow:0 1px 3px rgb(0 0 0 / 5%); }
    .pattern-row { display:grid; grid-template-columns:minmax(0,1fr) 130px; gap:12px; }
    label { display:block; margin-bottom:5px; color:var(--muted); font-size:12px; }
    input,textarea { width:100%; border:1px solid var(--border); border-radius:6px; background:#fff; color:var(--text); font:15px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace; }
    input { height:40px; padding:0 10px; }
    textarea { min-height:120px; margin-bottom:14px; padding:10px; resize:vertical; }
    .error { min-height:22px; color:var(--danger); }
    .summary { display:flex; align-items:baseline; gap:8px; margin:12px 0; }
    .summary strong { color:var(--accent); font-size:24px; }
    .results { display:grid; grid-template-columns:1fr 1fr; gap:22px; border-top:1px solid var(--border); padding-top:18px; }
    .results h2 { margin:0 0 10px; font-size:15px; }
    .tokens { max-height:320px; margin:0; padding:0; overflow:auto; list-style:none; }
    .tokens li { display:grid; grid-template-columns:auto auto 1fr; gap:8px; align-items:start; padding:7px 0; border-bottom:1px solid #edf0f1; }
    .raw { padding:1px 6px; border-radius:4px; background:#edf3f0; color:var(--accent); font-family:ui-monospace,SFMono-Regular,Consolas,monospace; }
    .kind { padding:2px 5px; border-radius:4px; background:#687872; color:#fff; font-size:10px; text-transform:uppercase; }
    .highlight { min-height:96px; padding:12px; border:1px solid var(--border); border-radius:6px; background:#fff; white-space:pre-wrap; overflow-wrap:anywhere; }
    mark { border-radius:3px; background:var(--amber); padding:1px 2px; }
    .privacy { margin:14px 0 0; color:var(--muted); font-size:12px; }
    @media (max-width:680px) { .wrap { margin:24px auto; } .pattern-row,.results { grid-template-columns:1fr; } .tokens { max-height:240px; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>Regex Visualizer · 正则可视化</h1>
    <p class="sub">逐项解释表达式，并在测试文本中高亮匹配</p>
    <section class="tool" aria-label="正则表达式分析器">
      <div class="pattern-row">
        <div><label for="pattern">Pattern</label><input id="pattern" value="\b(\w+)@(\w+)\.\w+\b" maxlength="500" spellcheck="false" /></div>
        <div><label for="flags">Flags</label><input id="flags" value="g" maxlength="8" spellcheck="false" /></div>
      </div>
      <label for="sample">测试文本</label>
      <textarea id="sample" maxlength="20000" spellcheck="false">联系 alice@example.com 或 bob@test.org 试试</textarea>
      <div id="error" class="error" role="alert"></div>
      <div class="summary"><strong id="count">0</strong><span>处匹配</span></div>
      <div class="results">
        <section><h2>表达式说明</h2><ol id="tokens" class="tokens"></ol></section>
        <section><h2>匹配预览</h2><div id="highlight" class="highlight"></div></section>
      </div>
      <p class="privacy">内容只在当前标签页处理。请勿对不可信表达式运行超长文本。</p>
    </section>
  </main>
  <script type="module">
    import { explain, findMatches, highlight } from './src/index.js';
    const $ = (id) => document.getElementById(id);
    let timer;
    function render() {
      const pattern = $('pattern').value, flags = $('flags').value, sample = $('sample').value;
      const explanation = explain(pattern, flags);
      const matches = findMatches(sample, pattern, flags);
      const error = explanation.error || matches.error || '';
      $('error').textContent = error;
      $('count').textContent = error ? '0' : String(matches.matches.length) + (matches.capped ? '+' : '');
      $('tokens').replaceChildren();
      if (!error) for (const token of explanation.tokens) {
        const item = document.createElement('li');
        const raw = document.createElement('span'); raw.className = 'raw'; raw.textContent = token.raw;
        const kind = document.createElement('span'); kind.className = 'kind'; kind.textContent = token.kind;
        const meaning = document.createElement('span'); meaning.textContent = token.meaning;
        item.append(raw, kind, meaning); $('tokens').append(item);
      }
      $('highlight').innerHTML = error ? '' : (highlight(sample, pattern, flags) || '<span>无匹配</span>');
    }
    function schedule() { clearTimeout(timer); timer = setTimeout(render, 120); }
    ['pattern','flags','sample'].forEach((id) => $(id).addEventListener('input', schedule));
    render();
  </script>
</body>
</html>
