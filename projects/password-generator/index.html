<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
  <title>Secure Password Generator · Small Tools Lab</title>
  <style>
    :root{color-scheme:dark;--bg:#101217;--card:#181b22;--text:#e8ebf1;--muted:#9ea7b5;--line:#2c313c;--accent:#77aaff;--bad:#ff8585}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:820px;margin:auto;padding:32px 20px 60px}h1{margin:0;font-size:25px}.sub{color:var(--muted);margin:5px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:17px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{color:var(--muted);font-size:13px}input[type=number]{display:block;width:100%;margin-top:5px;border:1px solid var(--line);border-radius:8px;background:#12151b;color:var(--text);padding:9px}.checks{display:flex;gap:13px;flex-wrap:wrap;margin:18px 0}.checks label{color:var(--text)}.actions{display:flex;gap:9px}button{border:1px solid var(--line);border-radius:9px;background:transparent;color:var(--text);padding:9px 14px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#0d1728;font-weight:650}.error{min-height:25px;color:var(--bad);margin-top:9px}.results{margin-top:13px}.password{display:flex;align-items:center;justify-content:space-between;gap:10px;border-top:1px solid var(--line);padding:10px 0}.password code{word-break:break-all}.password span{flex:none;color:var(--muted);font-size:12px}.note{color:var(--muted);font-size:13px}@media(max-width:600px){.fields{grid-template-columns:1fr}.password{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body><main class="wrap">
  <h1>Secure Password Generator</h1><p class="sub">Web Crypto 安全随机、字符类别保证、无模偏差。绝不回退到 Math.random。</p>
  <section class="card"><div class="fields"><label>长度<input id="length" type="number" min="4" max="1024" value="20"></label><label>数量<input id="count" type="number" min="1" max="100" value="5"></label></div>
  <div class="checks"><label><input id="lowercase" type="checkbox" checked> 小写</label><label><input id="uppercase" type="checkbox" checked> 大写</label><label><input id="digits" type="checkbox" checked> 数字</label><label><input id="symbols" type="checkbox" checked> 符号</label><label><input id="ambiguous" type="checkbox"> 排除 0O1lI 等易混字符</label></div>
  <div class="actions"><button class="primary" id="generate">生成</button><button id="copy">复制全部</button></div><div class="error" id="error" role="alert"></div><div class="results" id="results"></div>
  <p class="note">熵值是基于长度和候选字符池的估算，不代替密码审计。请留意剪贴板历史、浏览器扩展与屏幕共享。</p></section>
</main><script type="module" src="./src/app.js"></script></body>
</html>
