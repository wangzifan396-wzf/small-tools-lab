<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'self' data:">
  <title>YAML ↔ JSON · Small Tools Lab</title>
  <style>
    :root{color-scheme:light;--bg:#f7f5f0;--card:#fff;--text:#24221e;--muted:#746f66;--line:#e5e0d7;--accent:#a66b19;--danger:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1080px;margin:auto;padding:32px 20px 60px}h1{margin:0;font-size:26px}.sub{color:var(--muted);margin:5px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:14px}button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 14px;cursor:pointer}button.primary{color:#fff;background:var(--accent);border-color:var(--accent)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}textarea{width:100%;min-height:370px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:12px;background:#fcfbf8;color:var(--text);font:13px/1.55 ui-monospace,monospace}.error{min-height:24px;color:var(--danger);margin-top:9px}.note{color:var(--muted);font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="wrap">
  <h1>YAML ↔ JSON</h1>
  <p class="sub">严格、可预测的 YAML block 子集转换器。数据仅在本机处理。</p>
  <section class="card">
    <div class="actions"><button class="primary" id="to-json">YAML → JSON</button><button id="to-yaml">JSON → YAML</button><button id="sample">载入示例</button><button id="clear">清空</button></div>
    <div class="grid"><div><label for="source">输入</label><textarea id="source" spellcheck="false"></textarea></div><div><label for="output">输出</label><textarea id="output" readonly spellcheck="false"></textarea></div></div>
    <div class="error" id="error" role="alert"></div>
    <p class="note">支持嵌套映射、序列、flow 数组/对象、引号字符串及基础标量；锚点、标签、merge key、block scalar 与多文档会被明确拒绝。</p>
  </section>
</main><script type="module" src="./src/app.js"></script></body>
</html>
