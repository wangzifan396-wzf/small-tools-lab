<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>HTTP 状态码速查 · Small Tools Lab</title>
<style>
  :root { --bg:#faf9f7; --panel:#fff; --ink:#23211e; --mut:#8a857d; --bd:#e7e3dc; --ac:#b8832f; --ac2:#2f7d7b; }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); }
  .wrap { max-width:900px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:23px; margin:0 0 4px; letter-spacing:.3px; }
  .sub { color:var(--mut); margin:0 0 22px; }
  .card { background:var(--panel); border:1px solid var(--bd); border-radius:14px; padding:16px; margin-bottom:16px; }
  input[type=text] { width:100%; border:1px solid var(--bd); border-radius:8px; padding:10px 12px; font:14px inherit; background:#fff; color:var(--ink); }
  table { width:100%; border-collapse:collapse; margin-top:12px; font-size:13.5px; }
  th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--bd); vertical-align:top; }
  th { color:var(--mut); font-weight:600; position:sticky; top:0; background:var(--panel); }
  .code { font:14px ui-monospace,monospace; font-weight:700; cursor:pointer; }
  .pill { font-size:11px; padding:2px 8px; border-radius:999px; border:1px solid var(--bd); }
  .pill.i { background:#e8f0fb; color:#1c5fb0; border-color:#cfe0f5; }
  .pill.s { background:#e7f5ec; color:#1d7a43; border-color:#bfe6cd; }
  .pill.r { background:#fdf3e0; color:#a9651a; border-color:#f6e0bd; }
  .pill.e { background:#fdeaea; color:#b3261e; border-color:#f4c9c6; }
  .pill.x { background:#f0e8fb; color:#6b35b3; border-color:#e1d2f5; }
  .note { font-size:12.5px; color:var(--mut); margin-top:8px; }
  .ico { color:var(--ac2); }
  .empty { color:var(--mut); text-align:center; padding:20px; }
  footer { color:var(--mut); font-size:12px; text-align:center; margin-top:30px; }
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="ico">🌐</span> HTTP 状态码速查</h1>
  <p class="sub">搜索状态码或原因短语，点击码值可复制。纯浏览器零依赖。</p>

  <div class="card">
    <input type="text" id="q" placeholder="搜索，例如 404、Not Found、3xx、redirect…" />
    <div id="count" class="note"></div>
    <table id="tbl">
      <thead><tr><th>状态码</th><th>类别</th><th>原因短语</th><th>说明</th></tr></thead>
      <tbody id="body"></tbody>
    </table>
    <div class="note">类别：1xx 信息 · 2xx 成功 · 3xx 重定向 · 4xx 客户端错误 · 5xx 服务端错误。</div>
  </div>

  <footer>Small Tools Lab · 纯前端 · 数据不出本机</footer>
</div>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const CODES = [
    [100,"信息","Continue","继续：客户端应继续发送请求"],
    [101,"信息","Switching Protocols","切换协议"],
    [102,"信息","Processing","处理中（WebDAV）"],
    [200,"成功","OK","请求成功"],
    [201,"成功","Created","已创建"],
    [202,"成功","Accepted","已接受（异步处理）"],
    [204,"成功","No Content","无内容"],
    [206,"成功","Partial Content","部分内容（断点续传）"],
    [301,"重定向","Moved Permanently","永久重定向"],
    [302,"重定向","Found","临时重定向"],
    [303,"重定向","See Other","参见其它位置"],
    [304,"重定向","Not Modified","未修改（缓存）"],
    [307,"重定向","Temporary Redirect","临时重定向（方法不变）"],
    [308,"重定向","Permanent Redirect","永久重定向（方法不变）"],
    [400,"客户端错误","Bad Request","请求语法错误"],
    [401,"客户端错误","Unauthorized","未认证"],
    [403,"客户端错误","Forbidden","禁止访问"],
    [404,"客户端错误","Not Found","资源不存在"],
    [405,"客户端错误","Method Not Allowed","方法不允许"],
    [408,"客户端错误","Request Timeout","请求超时"],
    [409,"客户端错误","Conflict","冲突"],
    [410,"客户端错误","Gone","资源已永久删除"],
    [413,"客户端错误","Payload Too Large","负载过大"],
    [415,"客户端错误","Unsupported Media Type","不支持的媒体类型"],
    [418,"客户端错误","I'm a teapot","我是一个茶壶（彩蛋）"],
    [422,"客户端错误","Unprocessable Entity","无法处理的实体"],
    [429,"客户端错误","Too Many Requests","请求过于频繁"],
    [431,"客户端错误","Request Header Fields Too Large","请求头过大"],
    [451,"客户端错误","Unavailable For Legal Reasons","因法律原因不可用"],
    [500,"服务端错误","Internal Server Error","服务器内部错误"],
    [501,"服务端错误","Not Implemented","未实现"],
    [502,"服务端错误","Bad Gateway","网关错误"],
    [503,"服务端错误","Service Unavailable","服务不可用"],
    [504,"服务端错误","Gateway Timeout","网关超时"],
    [505,"服务端错误","HTTP Version Not Supported","HTTP 版本不支持"],
    [507,"服务端错误","Insufficient Storage","存储空间不足（WebDAV）"],
    [508,"服务端错误","Loop Detected","检测到循环（WebDAV）"],
    [511,"服务端错误","Network Authentication Required","需要网络认证"],
  ];
  const clsMap = {"信息":"i","成功":"s","重定向":"r","客户端错误":"e","服务端错误":"x"};
  function render(list){
    if(!list.length){ $("body").innerHTML='<tr><td colspan="4" class="empty">无匹配结果</td></tr>'; $("count").textContent="0 条"; return; }
    $("body").innerHTML = list.map(([c,cls,reason,desc])=>
      '<tr><td class="code" data-c="'+c+'" title="点击复制">'+c+'</td><td><span class="pill '+clsMap[cls]+'">'+cls+'</span></td><td>'+reason+'</td><td>'+desc+'</td></tr>'
    ).join("");
    $("count").textContent = list.length + " 条";
    $("body").querySelectorAll(".code").forEach(e=>e.onclick=()=>navigator.clipboard.writeText(e.dataset.c));
  }
  function search(){
    const q = $("q").value.trim().toLowerCase();
    if(!q){ render(CODES); return; }
    render(CODES.filter(([c,cls,reason,desc])=>
      String(c).includes(q) || reason.toLowerCase().includes(q) || desc.toLowerCase().includes(q) || cls.includes(q)
    ));
  }
  $("q").oninput = search;
  search();
})();
</script>
</body>
</html>
