<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRC 校验 · Small Tools Lab</title>
<style>
  :root { --bg:#f6f4f0;--panel:#fff;--ink:#2a2723;--muted:#8a8378;--line:#e7e2d9;--accent:#c2683f;--accent-soft:#f6e7df;--err:#c0392b;--shadow:0 8px 30px rgba(60,50,40,.10); }
  @media (prefers-color-scheme: dark){ :root{ --bg:#16140f;--panel:#211e18;--ink:#ece7df;--muted:#9b9384;--line:#322d25;--accent:#e08a5c;--accent-soft:#2f2620;--shadow:0 8px 30px rgba(0,0,0,.4);} }
  *{box-sizing:border-box;} body{margin:0;font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:32px 16px;display:flex;justify-content:center;}
  .wrap{width:100%;max-width:720px;} header{margin-bottom:22px;} h1{font-size:26px;margin:0 0 6px;} h1 .ico{color:var(--accent);} .sub{color:var(--muted);margin:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;} textarea{width:100%;min-height:110px;resize:vertical;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:14px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;} textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center;} select{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 12px;border-radius:10px;font:inherit;}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;} .seg button{border:0;background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;border-right:1px solid var(--line);} .seg button:last-child{border-right:0;} .seg button.on{background:var(--accent);color:#fff;}
  button.act{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;transition:.15s;} button.act:hover{border-color:var(--accent);color:var(--accent);} button.primary{background:var(--accent);color:#fff;border-color:var(--accent);} button.primary:hover{filter:brightness(1.05);color:#fff;}
  .err{color:var(--err);font-size:13px;min-height:18px;margin-top:8px;} .meta{color:var(--muted);font-size:13px;}
  .result{font:600 20px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--accent);letter-spacing:1px;padding:6px 0;}
</style>
</head>
<body>
<div class="wrap">
  <header><h1><span class="ico">🧮</span> CRC 校验计算</h1><p class="sub">CRC-16（CCITT / IBM-ARC / MODBUS / XMODEM）与 CRC-32 · 零依赖 · 本地运行</p></header>
  <div class="card">
    <label for="in">输入（文本或 HEX）</label>
    <textarea id="in" placeholder="123456789">123456789</textarea>
    <div class="row">
      <div class="seg" id="mode"><button data-m="text" class="on">文本</button><button data-m="hex">HEX</button></div>
      <label style="margin:0">算法</label>
      <select id="algo">
        <option>CRC-16/CCITT-FALSE</option><option>CRC-16/XMODEM</option>
        <option>CRC-16/IBM-ARC</option><option>CRC-16/MODBUS</option>
        <option>CRC-32</option>
      </select>
      <button class="act primary" id="calc">计算</button>
      <button class="act" id="copy">复制</button>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div class="card">
    <label>结果（十六进制）</label>
    <div class="result" id="out">—</div>
  </div>
</div>
<script src="src/crc.js"></script>
<script>
  (function(){
    var C=window.CRC, inp=document.getElementById('in'), out=document.getElementById('out'), err=document.getElementById('err'), algo=document.getElementById('algo');
    var mode='text';
    document.getElementById('mode').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;mode=b.getAttribute('data-m');Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});});
    function hexToBytes(h){h=h.replace(/\s/g,'').replace(/^0x/i,'');if(h.length%2)throw new Error('HEX 长度必须为偶数');var a=[];for(var i=0;i<h.length;i+=2){var v=parseInt(h.substr(i,2),16);if(isNaN(v))throw new Error('非法 HEX 字符');a.push(v);}return a;}
    function calc(){
      err.textContent='';var v=inp.value;if(!v){out.textContent='—';return;}
      try{
        var bytes=mode==='hex'?hexToBytes(v):Array.from(new TextEncoder().encode(v));
        out.textContent=C.compute(algo.value,bytes);
      }catch(e){err.textContent=e.message;out.textContent='—';}
    }
    document.getElementById('calc').addEventListener('click',calc);
    document.getElementById('copy').addEventListener('click',function(){if(out.textContent!=='—')navigator.clipboard&&navigator.clipboard.writeText(out.textContent);});
    inp.addEventListener('input',function(){err.textContent='';});
    calc();
  })();
</script>
</body>
</html>
