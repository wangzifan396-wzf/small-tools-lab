<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ctxcalc · 上下文 / Token 估算</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --border: #e7e4dd; --border-strong: #d8d4ca;
    --text: #22211e; --text-2: #56534c; --muted: #8b877e;
    --accent: #6a5acd; --accent-soft: #ece9f9; --ok: #3d8f61; --warn: #c0792b; --bad: #c0392b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14; --panel: #151922; --border: #232b3a; --border-strong: #34415a;
      --text: #e9edf5; --text-2: #aab3c6; --muted: #6e788e;
      --accent: #9d8cff; --accent-soft: #1d1a2e; --ok: #5fd0a0; --warn: #f0b269; --bad: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 28px 16px;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  textarea {
    width: 100%; min-height: 120px; padding: 12px 14px; border-radius: var(--r);
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-family: var(--mono); font-size: 14px; resize: vertical; line-height: 1.5;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
  select, input[type=number] {
    padding: 10px 12px; border-radius: var(--r); border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 14px;
  }
  select { flex: 1; min-width: 220px; }
  input[type=number] { width: 150px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 16px 18px; margin-top: 18px; }
  .stats { display: flex; flex-wrap: wrap; gap: 10px; }
  .stat { flex: 1; min-width: 110px; background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .v { font-size: 20px; font-weight: 700; font-family: var(--mono); }
  .bar { height: 12px; border-radius: 999px; background: var(--border); overflow: hidden; margin: 14px 0 6px; }
  .bar > span { display: block; height: 100%; background: var(--ok); transition: width .15s; }
  .bar.warn > span { background: var(--warn); }
  .bar.bad > span { background: var(--bad); }
  .verdict { font-weight: 600; }
  .verdict.ok { color: var(--ok); }
  .verdict.bad { color: var(--bad); }
  .cost { font-family: var(--mono); font-size: 14px; margin-top: 10px; }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; }
  td.num { font-family: var(--mono); text-align: right; }
  .chip { font-size: 12.5px; padding: 5px 11px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text-2); cursor: pointer; }
  .chip:hover { border-color: var(--accent); color: var(--accent); }
  .examples { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
  code { background: var(--accent-soft); padding: 1px 5px; border-radius: 5px; font-family: var(--mono); }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧮 ctxcalc · 上下文 / Token 估算</h1>
  <p class="sub">估算 token、看能否放进模型上下文窗口、算个示意成本。<strong>纯前端运行，数据不出本机。</strong></p>

  <textarea id="text" placeholder="粘贴你的提示词 / 文档…">请用中文写一段关于本地大语言模型智能体（agent）的简介，说明它如何调用工具、维护长期记忆，并与知识库检索结合。大约写 200 字。</textarea>

  <div class="examples" id="examples"></div>

  <div class="row">
    <select id="model"></select>
    <input id="outTokens" type="number" min="0" max="1000000" value="0" title="预计输出 token 数（可选）" placeholder="输出 token" />
  </div>

  <div class="card">
    <div class="stats">
      <div class="stat"><div class="k">估算 token</div><div class="v" id="tokens">—</div></div>
      <div class="stat"><div class="k">字符</div><div class="v" id="chars">—</div></div>
      <div class="stat"><div class="k">中文</div><div class="v" id="cjk">—</div></div>
      <div class="stat"><div class="k">词</div><div class="v" id="words">—</div></div>
    </div>
    <div class="bar" id="bar"><span id="barfill" style="width:0%"></span></div>
    <div class="verdict" id="verdict">—</div>
    <div class="cost" id="cost"></div>
  </div>

  <div class="label">在各模型上的容量对比</div>
  <div class="card">
    <table id="cmp">
      <thead><tr><th>模型</th><th class="num">上下文</th><th class="num">占比</th><th>容量</th></tr></thead>
      <tbody></tbody>
    </table>
  </div>

  <p class="foot">token 为启发式估算（中文≈1/字，拉丁≈1.3/词），成本为示意参考价，非真实账单 · 零依赖</p>
</div>

<script>
// --- inlined core (mirrors src/core/ctx.js) so this page runs over file:// ---
const CJK_RE = /[⺀-〇一-鿿＀-￯぀-ヿ가-힯]/g;
const LATIN_RE = /[A-Za-z0-9]+/g;
const MODELS = [
  { id:'gpt-4o', label:'GPT-4o', icon:'🟢', provider:'OpenAI', ctx:128000, inPer1k:0.005, outPer1k:0.015 },
  { id:'gpt-4o-mini', label:'GPT-4o mini', icon:'🟢', provider:'OpenAI', ctx:128000, inPer1k:0.00015, outPer1k:0.0006 },
  { id:'o3-mini', label:'OpenAI o3-mini', icon:'🟢', provider:'OpenAI', ctx:200000, inPer1k:0.0011, outPer1k:0.0044 },
  { id:'claude-3.7-sonnet', label:'Claude 3.7 Sonnet', icon:'🟠', provider:'Anthropic', ctx:200000, inPer1k:0.003, outPer1k:0.015 },
  { id:'claude-3.5-haiku', label:'Claude 3.5 Haiku', icon:'🟠', provider:'Anthropic', ctx:200000, inPer1k:0.0008, outPer1k:0.004 },
  { id:'gemini-2.0-flash', label:'Gemini 2.0 Flash', icon:'🔵', provider:'Google', ctx:1000000, inPer1k:0.0001, outPer1k:0.0004 },
  { id:'gemini-2.5-pro', label:'Gemini 2.5 Pro', icon:'🔵', provider:'Google', ctx:1000000, inPer1k:0.00125, outPer1k:0.01 },
  { id:'deepseek-chat', label:'DeepSeek-V3', icon:'🔶', provider:'DeepSeek', ctx:128000, inPer1k:0.00027, outPer1k:0.0011 },
  { id:'deepseek-reasoner', label:'DeepSeek-R1', icon:'🔶', provider:'DeepSeek', ctx:64000, inPer1k:0.00055, outPer1k:0.00219 },
  { id:'qwen-max', label:'Qwen-Max', icon:'🟣', provider:'Aliyun', ctx:32768, inPer1k:0.0016, outPer1k:0.004 },
  { id:'qwen3-235b', label:'Qwen3-235B', icon:'🟣', provider:'Aliyun', ctx:128000, inPer1k:0.0002, outPer1k:0.0006 },
  { id:'llama-3.1-405b', label:'Llama 3.1 405B', icon:'⚪', provider:'Meta', ctx:131072, inPer1k:0.0027, outPer1k:0.0027 },
  { id:'mistral-large', label:'Mistral Large', icon:'🟡', provider:'Mistral', ctx:128000, inPer1k:0.002, outPer1k:0.006 },
  { id:'grok-2', label:'Grok-2', icon:'⚫', provider:'xAI', ctx:131072, inPer1k:0.002, outPer1k:0.01 },
];
function analyze(text){
  const s=String(text==null?'':text);
  const cjk=(s.match(CJK_RE)||[]).length;
  const withoutCjk=s.replace(CJK_RE,'');
  const words=(withoutCjk.match(LATIN_RE)||[]).length;
  const other=withoutCjk.replace(LATIN_RE,'').length;
  const tokens=s.length===0?0:Math.max(1,Math.ceil(cjk*1+words*1.3+other*0.3));
  return {chars:s.length,cjk,words,other,tokens};
}
function fitContext(tokens,ctx){
  const ratio=ctx>0?tokens/ctx:1;
  return {ctx,ratio,pct:ctx>0?Math.min(100,Math.round(ratio*100)):100,fits:tokens<=ctx,remaining:Math.max(0,ctx-tokens),fitCopies:tokens>0?Math.floor(ctx/tokens):0};
}
function estimateCost(inT,outT,m){
  const ci=m.inPer1k||0,co=m.outPer1k||0;
  const costIn=(inT/1000)*ci, costOut=(outT/1000)*co;
  return {costIn,costOut,cost:costIn+costOut};
}
function fmt(n){ return n.toLocaleString(); }
function money(x){ return '$'+x.toFixed(x<0.01?6:4); }

const $ = (id)=>document.getElementById(id);
const sel = $('model');
MODELS.forEach(m=>{ const o=document.createElement('option'); o.value=m.id; o.textContent=`${m.icon} ${m.label}（${fmt(m.ctx)}）`; sel.appendChild(o); });
sel.value = 'claude-3.7-sonnet';

function render(){
  const text=$('text').value;
  const m=MODELS.find(x=>x.id===sel.value)||MODELS[0];
  const outT=parseInt($('outTokens').value,10)||0;
  const a=analyze(text);
  const fit=fitContext(a.tokens,m.ctx);
  const cost=estimateCost(a.tokens,outT,m);

  $('tokens').textContent=fmt(a.tokens);
  $('chars').textContent=fmt(a.chars);
  $('cjk').textContent=fmt(a.cjk);
  $('words').textContent=fmt(a.words);

  const bar=$('bar'), fill=$('barfill');
  fill.style.width=fit.pct+'%';
  bar.className='bar'+(fit.pct>90?' bad':fit.pct>70?' warn':'');
  const v=$('verdict');
  if(a.tokens===0){ v.textContent='输入为空'; v.className='verdict'; }
  else if(fit.fits){ v.textContent=`✅ 可放进 ${m.label}：占用 ${fit.pct}%，还剩 ${fmt(fit.remaining)} token，约可放 ${fmt(fit.fitCopies)} 份`; v.className='verdict ok'; }
  else { v.textContent=`⛔ 超出 ${m.label} 窗口 ${fmt(a.tokens-m.ctx)} token（${fit.pct}%），需压缩或换更大上下文的模型`; v.className='verdict bad'; }

  let c='成本（示意参考价）：输入 '+money(cost.costIn);
  if(outT>0) c+=' + 输出 '+money(cost.costOut)+' = '+money(cost.cost);
  else c+='（填写输出 token 可估算总成本）';
  $('cost').textContent=c;

  // comparison table
  const tb=$('cmp').querySelector('tbody');
  tb.innerHTML='';
  MODELS.slice().sort((x,y)=>y.ctx-x.ctx).forEach(mm=>{
    const f=fitContext(a.tokens,mm.ctx);
    const tr=document.createElement('tr');
    const tag=f.fits?(f.pct>70?'⚠️':'✅'):'⛔';
    tr.innerHTML=`<td>${mm.icon} ${mm.label}</td><td class="num">${fmt(mm.ctx)}</td><td class="num">${f.pct}%</td><td>${tag} ${f.fitCopies>0?('×'+fmt(f.fitCopies)):('缺 '+fmt(a.tokens-mm.ctx))}</td>`;
    tb.appendChild(tr);
  });
}
['text','model','outTokens'].forEach(id=>$(id).addEventListener('input',render));

const EX=['你好 world','System prompt: you are a helpful assistant.','一段中文长文本：本地智能体能够调用工具、维护记忆并检索知识库，从而完成复杂任务。'];
const exWrap=$('examples');
EX.forEach(e=>{ const c=document.createElement('span'); c.className='chip'; c.textContent=e.length>18?e.slice(0,18)+'…':e; c.title=e; c.onclick=()=>{ $('text').value=e; render(); }; exWrap.appendChild(c); });
render();
</script>
</body>
</html>
