<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
  <title>SemVer Check · Small Tools Lab</title>
  <style>
    :root{--bg:#f7f5f0;--card:#fff;--text:#24221e;--muted:#746f66;--line:#e5e0d7;--accent:#2d7774;--good:#19743c;--bad:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:880px;margin:auto;padding:32px 20px 60px}h1{margin:0;font-size:26px}.sub{color:var(--muted);margin:5px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px}label{display:block;color:var(--muted);font-size:13px;margin-bottom:6px}textarea,input{width:100%;border:1px solid var(--line);border-radius:9px;background:#fcfbf8;padding:10px;font:14px ui-monospace,monospace}textarea{min-height:145px;resize:vertical}.actions,.range{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}.range input{flex:1;min-width:180px}button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:9px 14px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}#status{min-height:25px;margin-top:12px;color:var(--muted)}#status[data-state=ok]{color:var(--good)}#status[data-state=error]{color:var(--bad)}code{background:#f0ede7;padding:2px 5px;border-radius:5px}
  </style>
</head>
<body><main class="wrap">
  <h1>SemVer Check</h1><p class="sub">严格 SemVer 2.0 校验、比较、排序与范围匹配。</p>
  <section class="card"><label for="versions">版本列表（每行一个，可带 v 前缀）</label><textarea id="versions">v1.2.3
2.0.0-beta.1
1.10.0
1.2.3-alpha
0.9.0</textarea><div class="actions"><button class="primary" id="sort">升序排序</button><button id="validate">全部校验</button></div></section>
  <section class="card"><label for="range">范围：支持 <code>^</code>、<code>~</code>、通配符、比较器、AND、<code>||</code> 和 hyphen range</label><div class="range"><input id="range" value="^1.2.0" aria-label="版本范围"><input id="candidate" value="1.5.0" aria-label="候选版本"><button class="primary" id="check">检查</button></div><div id="status" role="status"></div></section>
</main><script type="module" src="./src/app.js"></script></body>
</html>
