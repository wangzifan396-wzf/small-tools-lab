name: Budget calculation bug
description: Report incorrect matrix, concurrency, timeout, schedule, or runner analysis
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Use a minimal synthetic workflow and remove private action references or secrets.
  - type: input
    id: version
    attributes:
      label: Action Budget version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: workflow
    attributes:
      label: Minimal workflow
      render: yaml
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual metrics
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Ubuntu, Node.js 22
    validations:
      required: true
