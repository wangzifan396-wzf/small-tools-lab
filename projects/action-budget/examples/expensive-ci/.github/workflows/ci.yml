name: Expensive CI

on:
  push:
  pull_request:
  schedule:
    - cron: "*/15 * * * *"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [18, 20, 22, 24]
        exclude:
          - os: windows-latest
            node: 18
        include:
          - os: ubuntu-latest
            node: 24
            experimental: true
          - os: ubuntu-latest
            node: 25
    steps:
      - run: echo test

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      max-parallel: 6
      matrix:
        browser: [chromium, firefox, webkit, chrome, edge]
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - run: echo browser

  generated:
    runs-on: ubuntu-latest
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - run: echo generated

  downstream:
    uses: example/automation/.github/workflows/release.yml@main
