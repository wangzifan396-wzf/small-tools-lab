<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Plan working-hour overlaps across time zones in the browser.">
    <meta name="theme-color" content="#f5f7f4">
    <title>TimeWeave</title>
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="styles.css">
    <script src="src/time.js" defer></script>
    <script src="src/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#planner">Skip to planner</a>
    <header class="app-header">
      <a class="brand" href="index.html">
        <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
        <span>TimeWeave</span>
      </a>
      <div class="header-actions">
        <span class="live-status"><i></i><span id="utc-clock">UTC --:--</span></span>
        <a class="icon-button" href="README.md" aria-label="Open project readme" title="Project readme">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2Z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7Z"/></svg>
        </a>
        <button class="icon-button" id="theme-toggle" type="button" aria-label="Use dark theme" title="Toggle theme">
          <svg class="moon-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
          <svg class="sun-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <main id="planner">
      <section class="control-band" aria-labelledby="planner-title">
        <div class="title-block">
          <span>WORKING HOURS / UTC</span>
          <h1 id="planner-title">Overlap planner</h1>
        </div>
        <div class="date-control">
          <button class="icon-button" id="previous-day" type="button" aria-label="Previous day" title="Previous day">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          </button>
          <label>Date<input id="plan-date" type="date"></label>
          <button class="icon-button" id="next-day" type="button" aria-label="Next day" title="Next day">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg>
          </button>
        </div>
        <label class="select-control">Reference zone<select id="reference-zone"></select></label>
        <div class="duration-control">
          <span>Duration</span>
          <div class="segmented" role="group" aria-label="Meeting duration">
            <button type="button" data-duration="30">30m</button>
            <button type="button" data-duration="60" aria-pressed="true">1h</button>
            <button type="button" data-duration="90">90m</button>
          </div>
        </div>
        <div class="control-actions">
          <button class="button" id="share-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 10.5 6.8-4M8.6 13.5l6.8 4"/></svg>
            Share
          </button>
          <button class="button primary" id="calendar-button" type="button">
            <svg aria-hidden="true" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>
            Calendar
          </button>
        </div>
      </section>

      <section class="planner-band">
        <aside class="zone-panel" aria-labelledby="zones-title">
          <div class="panel-heading">
            <div><span>01</span><h2 id="zones-title">Locations</h2></div>
            <output id="zone-count">4</output>
          </div>
          <div class="add-zone">
            <select id="zone-picker" aria-label="Time zone to add"></select>
            <button class="icon-button" id="add-zone" type="button" aria-label="Add time zone" title="Add time zone">
              <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
            </button>
          </div>
          <div class="zone-list" id="zone-list"></div>
          <div class="work-hours">
            <div class="panel-heading compact-heading"><div><span>02</span><h2>Workday</h2></div></div>
            <div class="hours-row">
              <label>Start<input id="work-start" type="number" min="0" max="23" value="9"></label>
              <span aria-hidden="true">to</span>
              <label>End<input id="work-end" type="number" min="1" max="24" value="17"></label>
            </div>
          </div>
        </aside>

        <div class="timeline-panel">
          <div class="panel-heading timeline-heading">
            <div><span>03</span><h2>Day timeline</h2></div>
            <div class="timeline-legend" aria-label="Timeline legend"><span><i class="work"></i>Working</span><span><i class="overlap"></i>Overlap</span><span><i class="selected"></i>Selected</span></div>
          </div>
          <div class="timeline-scroll" id="timeline-scroll">
            <div class="timeline" id="timeline" role="grid" aria-label="Time zone comparison"></div>
          </div>
          <div class="selection-strip" id="selection-strip" aria-live="polite"></div>
        </div>
      </section>

      <section class="recommend-band" aria-labelledby="recommend-title">
        <div class="panel-heading">
          <div><span>04</span><h2 id="recommend-title">Best windows</h2></div>
          <span class="date-label" id="date-label"></span>
        </div>
        <div class="recommend-grid" id="recommend-grid"></div>
      </section>
    </main>
    <footer><span>TimeWeave</span><span>MIT licensed</span><span>Times are computed on this device</span></footer>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
