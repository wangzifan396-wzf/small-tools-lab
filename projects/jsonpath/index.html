<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSONPath Explorer · JSON 路径查询</title>
  <style>
    :root { color-scheme: light dark; --bg:#f5f7f4; --panel:#fff; --line:#d7ded8; --text:#17211b; --muted:#64736a; --accent:#16704c; --soft:#e7f3ec; }
    @media (prefers-color-scheme: dark) { :root { --bg:#0f1512; --panel:#161e19; --line:#2d3c33; --text:#eef6f0; --muted:#9aac9f; --accent:#70d39f; --soft:#183326; } }
    * { box-sizing:border-box; } body { margin:0; padding:28px 16px; background:var(--bg); color:var(--text); font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .wrap { max-width:1080px; margin:auto; } h1 { margin:0 0 4px; font-size:25px; } .sub { margin:0 0 20px; color:var(--muted); }
    .bar { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:14px; } label { color:var(--muted); font-size:13px; }
    input, textarea { border:1px solid var(--line); border-radius:7px; background:var(--panel); color:var(--text); font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    #path { min-width:300px; padding:9px 11px; } button { padding:9px 15px; border:1px solid var(--accent); border-radius:7px; background:var(--accent); color:#fff; cursor:pointer; font-weight:650; } button.ghost { background:transparent; color:var(--accent); }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; } .panel { padding:12px; border:1px solid var(--line); border-radius:8px; background:var(--panel); } .label { margin:0 0 7px; color:var(--muted); font-size:12px; }
    textarea { display:block; width:100%; min-height:360px; padding:11px; resize:vertical; } pre { margin:0; min-height:360px; max-height:520px; overflow:auto; padding:11px; border:1px solid var(--line); border-radius:7px; background:var(--soft); white-space:pre-wrap; word-break:break-word; font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .status { min-height:24px; margin:10px 0 0; color:var(--muted); } .status.error { color:#c0392b; } .hint { margin-top:16px; color:var(--muted); font-size:12px; } code { padding:2px 4px; border-radius:4px; background:var(--soft); }
    @media (max-width:700px) { .grid { grid-template-columns:1fr; } #path { min-width:0; width:100%; } .bar button { flex:1; } }
  </style>
</head>
<body>
  <main class="wrap">
    <h1>JSONPath Explorer · JSON 路径查询</h1>
    <p class="sub">安全查询 JSON，不执行表达式；每个结果都带可复制的完整路径。</p>
    <div class="bar">
      <label for="path">路径</label><input id="path" value="$.users[*].name" spellcheck="false" autocomplete="off">
      <button id="run">查询</button><button id="sample" class="ghost">载入示例</button><button id="copy" class="ghost">复制结果</button>
    </div>
    <div class="grid">
      <section class="panel"><p class="label">输入 JSON</p><textarea id="input" spellcheck="false">{
  "users": [
    { "name": "Ada", "role": "admin" },
    { "name": "Lin", "role": "editor" }
  ]
}</textarea></section>
      <section class="panel"><p class="label">匹配结果</p><pre id="output">-</pre></section>
    </div>
    <p id="status" class="status" role="status"></p>
    <p class="hint">语法示例：<code>$.users[0].name</code> · <code>$.users[*].name</code> · <code>$..name</code> · <code>$['a.b']</code></p>
  </main>
  <script src="src/index.js"></script>
  <script>
    const $ = (id) => document.getElementById(id);
    const sample = '{\n  "users": [\n    { "name": "Ada", "profile": { "city": "London" } },\n    { "name": "Lin", "profile": { "city": "Shanghai" } }\n  ]\n}';
    function run() {
      $('status').className = 'status';
      try {
        const results = window.JsonPathTool.query($('input').value, $('path').value.trim());
        $('output').textContent = JSON.stringify(results, null, 2);
        $('status').textContent = results.length + ' 个匹配';
      } catch (error) {
        $('output').textContent = '-';
        $('status').className = 'status error';
        $('status').textContent = '查询失败：' + error.message;
      }
    }
    $('run').addEventListener('click', run);
    $('input').addEventListener('input', run);
    $('path').addEventListener('input', run);
    $('sample').addEventListener('click', () => { $('input').value = sample; $('path').value = '$..name'; run(); });
    $('copy').addEventListener('click', () => { navigator.clipboard?.writeText($('output').textContent); });
    run();
  </script>
</body>
</html>
