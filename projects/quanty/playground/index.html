<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>quanty · live playground</title>
  <style>
    :root { --bg:#0f1115; --panel:#171a21; --ink:#e7e9ee; --muted:#9aa3b2; --line:#262b36; --accent:#6ea8fe; --ok:#57c98a; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
    header { padding:18px 22px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
    header h1 { font-size:18px; margin:0; }
    header span { color:var(--muted); }
    main { padding:16px 22px; display:flex; flex-direction:column; gap:12px; max-width:820px; }
    .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    input, select, button { background:var(--panel); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:8px 10px; font-size:13px; font-family:ui-monospace,Menlo,Consolas,monospace; }
    input[type=text], input[type=number] { flex:1; min-width:160px; }
    button.primary { background:var(--accent); color:#08121f; border-color:var(--accent); font-weight:600; cursor:pointer; }
    .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px; }
    .panel h3 { margin:0 0 8px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; }
    .ok { color:var(--ok); }
    pre { white-space:pre-wrap; margin:0; font-family:ui-monospace,Menlo,Consolas,monospace; font-size:13px; }
    .muted { color:var(--muted); }
    label.chk { display:flex; align-items:center; gap:6px; color:var(--muted); }
  </style>
  <!--
    file:// guard. A classic script keeps working when module scripts are
    blocked by CORS on the file: protocol — which is exactly what makes every
    button on the page look dead. Explain it instead of failing silently.
  -->
  <script>
    (function () {
      if (location.protocol !== 'file:') return;
      var CMD = 'node playground/serve.js';
      function show() {
        var box = document.createElement('div');
        box.setAttribute('style', 'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;' +
          'justify-content:center;padding:24px;background:#faf9f7;color:#22211e;' +
          'font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif');
        box.innerHTML =
          '<div style="max-width:560px;background:#fff;border:1px solid #e7e4dd;border-radius:14px;' +
          'box-shadow:0 24px 60px -12px rgba(28,25,20,.18);padding:28px 30px">' +
          '<div style="font-size:28px;margin-bottom:10px">🔌</div>' +
          '<h1 style="margin:0 0 12px;font-size:20px;font-weight:640">请通过本地服务打开</h1>' +
          '<p style="margin:0 0 14px;color:#56534c">你现在是用 <code style="background:#f5f3ef;border:1px solid #e7e4dd;padding:2px 6px;border-radius:5px;font-size:12.5px">file://</code> 直接打开这个页面的。' +
          '浏览器会按同源策略拦截模块脚本，页面里的按钮因此<b>全部不会响应</b>。</p>' +
          '<ol style="margin:0 0 14px;padding-left:20px;color:#56534c">' +
          '<li>Windows：双击项目根目录的 <b>start.cmd</b></li>' +
          '<li>macOS / Linux：终端执行 <b>./start.sh</b></li>' +
          '<li>或手动运行：<code id="fg-cmd" style="background:#f5f3ef;border:1px solid #e7e4dd;padding:2px 6px;border-radius:5px;font-size:12.5px">' + CMD + '</code>' +
          ' <button id="fg-copy" type="button" style="font-size:12px;padding:3px 9px;margin-left:6px;border-radius:6px;border:1px solid #e7e4dd;background:#f3f1ec;color:#56534c;cursor:pointer">复制</button></li>' +
          
          '</ol>' +
          '<p style="margin:0;font-size:13px;color:#8b877e">启动后访问 <b>http://localhost:4173</b> 即可正常使用。</p>' +
          '</div>';
        document.body.appendChild(box);
        var b = document.getElementById('fg-copy');
        if (b) b.onclick = function () {
          try { navigator.clipboard.writeText(CMD); b.textContent = '已复制'; }
          catch (e) { b.textContent = '请手动复制'; }
        };
      }
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', show);
      else show();
    })();
  </script>
</head>
<body>
  <header>
    <h1>quanty</h1>
    <span>zero-dependency number &amp; byte formatter — runs entirely in your browser</span>
  </header>

  <main>
    <div class="row">
      <label>mode
        <select id="mode">
          <option value="bytes">bytes</option>
          <option value="parse">parse</option>
          <option value="number">number</option>
          <option value="compact">compact</option>
          <option value="ordinal">ordinal</option>
        </select>
      </label>
      <input id="value" type="text" value="1536" spellcheck="false" />
      <label>style
        <select id="style"><option value="">(default)</option><option value="si">si</option><option value="zh">zh</option></select>
      </label>
      <label class="chk"><input id="si" type="checkbox" /> SI (bytes)</label>
      <label class="chk"><input id="zh" type="checkbox" /> zh (ordinal)</label>
      <button class="primary" id="run">Run</button>
    </div>

    <div class="panel">
      <h3>Result</h3>
      <pre id="out">—</pre>
    </div>
  </main>

  <script type="module">
    import { formatBytes, parseBytes, formatNumber, formatCompact, ordinal } from '../src/index.js';

    const $ = (id) => document.getElementById(id);

    function run() {
      const mode = $('mode').value;
      const raw = $('value').value.trim();
      try {
        let result;
        if (mode === 'bytes') {
          result = formatBytes(Number(raw), { binary: !$('si').checked, decimals: 1 });
        } else if (mode === 'parse') {
          result = String(parseBytes(raw));
        } else if (mode === 'number') {
          result = formatNumber(Number(raw), { thousands: true, decimals: 0 });
        } else if (mode === 'compact') {
          const style = $('style').value || 'si';
          result = formatCompact(Number(raw), { style });
        } else if (mode === 'ordinal') {
          result = ordinal(Number(raw), { lang: $('zh').checked ? 'zh' : 'en' });
        }
        $('out').textContent = String(result);
      } catch (e) {
        $('out').textContent = String(e.message);
      }
    }

    $('run').addEventListener('click', run);
    run();
  </script>
</body>
</html>
