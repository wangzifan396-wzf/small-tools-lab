<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
  <title>CIDR Toolkit · Small Tools Lab</title>
  <style>
    :root{--bg:#f6f4f0;--card:#fff;--text:#24231f;--muted:#736f67;--line:#e3dfd7;--accent:#a36319;--bad:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:980px;margin:auto;padding:32px 20px 60px}h1{margin:0;font-size:26px}.sub{color:var(--muted);margin:5px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:17px;margin-bottom:14px}h2{font-size:16px;margin:0 0 12px}label{display:block;color:var(--muted);font-size:13px}input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;background:#fcfbf8;padding:9px;font:14px ui-monospace,monospace}.row{display:flex;gap:9px;align-items:end;flex-wrap:wrap}.row label{flex:1;min-width:180px}.row .prefix{max-width:150px}button{border:1px solid var(--line);border-radius:8px;background:#fff;padding:9px 14px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.results{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:14px}.results>div{display:flex;justify-content:space-between;gap:12px;background:#fff;padding:10px}.results span{color:var(--muted);font-size:12px}.results code{text-align:right;word-break:break-all}.message{min-height:24px;margin-top:9px}.error{color:var(--bad)}textarea{min-height:130px;resize:vertical;margin-top:12px}@media(max-width:650px){.results{grid-template-columns:1fr}.row{align-items:stretch}.row button{width:100%}}
  </style>
</head>
<body><main class="wrap"><h1>CIDR Toolkit</h1><p class="sub">严格 IPv4 / IPv6 子网计算、包含关系、重叠检测与安全拆分。</p>
  <section class="card"><h2>子网详情</h2><div class="row"><label>CIDR<input id="cidr" value="2001:db8:abcd:12::1/64" spellcheck="false"></label><button class="primary" id="calculate">计算</button></div><div id="error" class="message error" role="alert"></div><div class="results" id="results"></div></section>
  <section class="card"><h2>包含与重叠</h2><div class="row"><label>容器网段<input id="container" value="10.0.0.0/8"></label><label>地址或子网<input id="candidate" value="10.20.0.0/16"></label><button class="primary" id="relationship">检查</button></div><div id="relation-result" class="message"></div><div id="relation-error" class="message error" role="alert"></div></section>
  <section class="card"><h2>拆分子网</h2><div class="row"><label>原网段<input id="split-cidr" value="192.168.0.0/24"></label><label class="prefix">新前缀<input id="new-prefix" type="number" value="26" min="0" max="128"></label><button class="primary" id="split">拆分</button></div><div id="split-error" class="message error" role="alert"></div><textarea id="split-output" readonly></textarea></section>
</main><script type="module" src="./src/app.js"></script></body>
</html>
