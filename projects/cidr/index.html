<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CIDR 子网计算 · Small Tools Lab</title>
<style>
  :root { --bg:#f6f4f0;--panel:#fff;--ink:#2a2723;--muted:#8a8378;--line:#e7e2d9;--accent:#c2683f;--accent-soft:#f6e7df;--err:#c0392b;--shadow:0 8px 30px rgba(60,50,40,.10); }
  @media (prefers-color-scheme: dark){ :root{ --bg:#16140f;--panel:#211e18;--ink:#ece7df;--muted:#9b9384;--line:#322d25;--accent:#e08a5c;--accent-soft:#2f2620;--shadow:0 8px 30px rgba(0,0,0,.4);} }
  *{box-sizing:border-box;} body{margin:0;font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:32px 16px;display:flex;justify-content:center;}
  .wrap{width:100%;max-width:720px;} header{margin-bottom:22px;} h1{font-size:26px;margin:0 0 6px;} h1 .ico{color:var(--accent);} .sub{color:var(--muted);margin:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;} input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;} input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center;}
  button.act{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;transition:.15s;} button.act:hover{border-color:var(--accent);color:var(--accent);} button.primary{background:var(--accent);color:#fff;border-color:var(--accent);} button.primary:hover{filter:brightness(1.05);color:#fff;}
  .err{color:var(--err);font-size:13px;min-height:18px;margin-top:8px;}
  table{width:100%;border-collapse:collapse;margin-top:4px;} td{padding:9px 10px;border-bottom:1px solid var(--line);font-size:14px;} td:first-child{color:var(--muted);width:38%;font-weight:600;} td:last-child{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;} .copy{cursor:pointer;border:0;background:transparent;color:var(--accent);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <header><h1><span class="ico">🌐</span> CIDR 子网计算</h1><p class="sub">IPv4 网段 / 掩码 / 可用主机 · 零依赖 · 本地运行</p></header>
  <div class="card">
    <label for="in">输入 CIDR（如 192.168.1.0/24）</label>
    <input id="in" placeholder="192.168.1.0/24" value="192.168.1.0/24" />
    <div class="row">
      <button class="act primary" id="go">计算</button>
      <button class="act" id="copy">复制网络地址</button>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div class="card">
    <label>计算结果</label>
    <table id="tbl"><tbody><tr><td colspan="2" class="muted">—</td></tr></tbody></table>
  </div>
</div>
<script src="src/cidr.js"></script>
<script>
  (function(){
    var C=window.CidrTool, inp=document.getElementById('in'), err=document.getElementById('err'), tbl=document.getElementById('tbl');
    var last=null;
    function render(){
      err.textContent='';
      try{
        var r=C.calc(inp.value.trim());last=r;
        var rows=[
          ['网络地址',r.network],['广播地址',r.broadcast],['子网掩码',r.netmask],['通配符掩码',r.wildcard],
          ['首可用主机',r.firstHost],['末可用主机',r.lastHost],['地址总数',r.totalAddresses],
          ['可用主机数',r.hostCount],['主机范围',r.range]
        ];
        tbl.innerHTML='<tbody>'+rows.map(function(x){return '<tr><td>'+x[0]+'</td><td>'+x[1]+'</td></tr>';}).join('')+'</tbody>';
      }catch(e){err.textContent=e.message;tbl.innerHTML='<tbody><tr><td colspan="2">—</td></tr></tbody>';last=null;}
    }
    document.getElementById('go').addEventListener('click',render);
    inp.addEventListener('input',render);
    document.getElementById('copy').addEventListener('click',function(){if(last&&navigator.clipboard)navigator.clipboard.writeText(last.network);});
    render();
  })();
</script>
</body>
</html>
