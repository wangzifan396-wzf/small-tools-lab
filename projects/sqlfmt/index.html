<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
  <title>SQL Formatter · Small Tools Lab</title>
  <style>
    :root{--bg:#f4f5f3;--card:#fff;--text:#20231f;--muted:#6d746c;--line:#dfe3dc;--accent:#28756d;--bad:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:auto;padding:32px 20px 60px}h1{margin:0;font-size:26px}.sub{color:var(--muted);margin:5px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:13px}button,select{border:1px solid var(--line);border-radius:8px;background:#fff;padding:8px 12px}button{cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}.toolbar label{color:var(--muted);font-size:13px;display:flex;align-items:center;gap:5px}.toolbar .push{margin-left:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.grid label{display:block;color:var(--muted);font-size:13px;margin-bottom:5px}textarea{width:100%;min-height:480px;border:1px solid var(--line);border-radius:9px;background:#fbfcfa;color:var(--text);padding:11px;font:13px/1.55 ui-monospace,monospace;resize:vertical}.error{min-height:25px;color:var(--bad);margin-top:8px}.note{color:var(--muted);font-size:13px}@media(max-width:760px){.grid{grid-template-columns:1fr}.toolbar .push{margin-left:0}}
  </style>
</head>
<body><main class="wrap"><h1>SQL Formatter</h1><p class="sub">词法安全的通用 SQL 排版与压缩。字符串、标识符、占位符和注释保持隔离。</p>
  <section class="card"><div class="toolbar"><button class="primary" id="format">格式化</button><button id="minify">压缩</button><button id="swap">输出作为输入</button><button id="sample">示例</button><label>关键字<select id="keyword-case"><option value="upper">UPPER</option><option value="lower">lower</option><option value="preserve">保持</option></select></label><label>缩进<select id="indent"><option>2</option><option>4</option></select></label><label><input id="remove-comments" type="checkbox"> 压缩时删除注释</label><button class="push" id="copy">复制</button></div><div class="grid"><div><label for="input">输入</label><textarea id="input" spellcheck="false"></textarea></div><div><label for="output">输出</label><textarea id="output" readonly spellcheck="false"></textarea></div></div><div id="error" class="error" role="alert"></div><p class="note">这是空白格式化器，不执行 SQL，也不替代方言级语法验证。删除注释是显式选项，因为 optimizer hint 可能影响语义。</p></section>
</main><script type="module" src="./src/app.js"></script></body>
</html>
