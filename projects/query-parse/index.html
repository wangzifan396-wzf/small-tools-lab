<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; connect-src 'none'">
  <title>Query Parse · Small Tools Lab</title>
  <style>
    :root{--bg:#f7f5f0;--card:#fff;--text:#24221e;--muted:#746f66;--line:#e5e0d7;--accent:#a66b19;--bad:#b3261e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.55 system-ui,"Microsoft YaHei",sans-serif}.wrap{max-width:980px;margin:auto;padding:32px 20px 60px}h1{margin:0;font-size:26px}.sub{color:var(--muted);margin:5px 0 22px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:17px;margin-bottom:14px}label{color:var(--muted);font-size:13px}textarea,input{border:1px solid var(--line);border-radius:8px;background:#fcfbf8;padding:9px;font:14px ui-monospace,monospace}textarea{display:block;width:100%;min-height:80px;margin:6px 0 10px;resize:vertical}.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}button{border:1px solid var(--line);border-radius:9px;background:#fff;padding:8px 13px;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button.danger{color:var(--bad)}.pair{display:grid;grid-template-columns:1fr 1fr auto auto;gap:8px;margin:8px 0;align-items:center}.pair label{white-space:nowrap}.output{background:#f4f1eb;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px;font:13px ui-monospace,monospace;word-break:break-all}.error{min-height:24px;color:var(--bad);margin-top:7px}.hint{color:var(--muted);font-size:13px}@media(max-width:660px){.pair{grid-template-columns:1fr 1fr}.pair button,.pair label{justify-self:start}}
  </style>
</head>
<body><main class="wrap"><h1>Query Parse</h1><p class="sub">无损区分 flag 与 flag=，保留重复键和 fragment，安全解析并确定性重建。</p>
  <section class="card"><label for="input">URL、相对地址或裸查询串</label><textarea id="input">https://example.com/search?q=small+tools&tag=web&tag=dev&debug#results</textarea><div class="actions"><button class="primary" id="parse">解析</button><label><input id="plus" type="checkbox" checked> 将 + 解释为空格</label></div><div class="error" id="error" role="alert"></div></section>
  <section class="card"><div id="pairs"></div><div class="actions"><button id="add">添加参数</button><button id="clear">清空参数</button></div></section>
  <section class="card"><div class="hint">查询串</div><div class="output" id="query-output"></div><div class="hint">完整重建结果</div><div class="output" id="url-output"></div><div class="actions"><button id="copy">复制查询串</button></div></section>
</main><script type="module" src="./src/app.js"></script></body>
</html>
