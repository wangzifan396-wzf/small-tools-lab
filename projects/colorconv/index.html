<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>colorconv · 颜色格式转换</title>
<style>
  :root {
    --bg: #faf9f7; --panel: #fff; --border: #e7e4dd; --border-strong: #d8d4ca;
    --text: #22211e; --text-2: #56534c; --muted: #8b877e;
    --accent: #6a5acd; --accent-soft: #ece9f9; --ok: #3d8f61; --warn: #c0792b; --bad: #c0392b;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    --r: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0f14; --panel: #151922; --border: #232b3a; --border-strong: #34415a;
      --text: #e9edf5; --text-2: #aab3c6; --muted: #6e788e;
      --accent: #9d8cff; --accent-soft: #1d1a2e; --ok: #5fd0a0; --warn: #f0b269; --bad: #ff8a7a;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6; padding: 28px 16px;
    display: flex; justify-content: center;
  }
  .wrap { width: 100%; max-width: 720px; }
  h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin: 0 0 16px; font-size: 14px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 12px; }
  input[type=text] {
    flex: 1; min-width: 220px; padding: 10px 12px; border-radius: var(--r);
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    font-size: 14px; font-family: var(--mono);
  }
  input[type=text]:focus { outline: none; border-color: var(--accent); }
  .preview {
    width: 64px; height: 64px; border-radius: var(--r); border: 1px solid var(--border);
    flex: 0 0 auto;
  }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--r); padding: 14px 16px; margin-top: 14px; }
  .grid { display: grid; grid-template-columns: 90px 1fr auto; gap: 10px; align-items: center; }
  .grid + .grid { margin-top: 10px; }
  .k { font-size: 13px; color: var(--muted); }
  .v { font-family: var(--mono); font-size: 14px; word-break: break-all; }
  button {
    padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border);
    background: var(--panel-2); color: var(--text); font-size: 12.5px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 0 0 8px; }
  .err { color: var(--bad); font-size: 13px; margin-top: 10px; min-height: 18px; }
  .foot { color: var(--muted); font-size: 12px; margin-top: 18px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎨 colorconv · 颜色格式转换</h1>
  <p class="sub">在 <strong>HEX / RGB / HSL</strong> 之间互转，实时预览。纯前端运行，零依赖。</p>

  <div class="row">
    <input id="input" type="text" value="#6a5acd" placeholder="例如 #6a5acd / rgb(106,90,205) / hsl(251,49%,58%)" />
    <div class="preview" id="preview"></div>
  </div>
  <div class="err" id="err"></div>

  <div class="card">
    <p class="label">转换结果</p>
    <div class="grid">
      <span class="k">HEX</span><span class="v" id="hex">—</span><button data-copy="hex">复制</button>
    </div>
    <div class="grid">
      <span class="k">RGB</span><span class="v" id="rgb">—</span><button data-copy="rgb">复制</button>
    </div>
    <div class="grid">
      <span class="k">HSL</span><span class="v" id="hsl">—</span><button data-copy="hsl">复制</button>
    </div>
  </div>

  <p class="foot">HEX ↔ RGB ↔ HSL · 零依赖 · 数据不出本机</p>
</div>

<script type="module">
import { formatHsl, formatRgb, parseColor, rgbToHex } from './src/index.js';
const $=(id)=>document.getElementById(id);
function render(){
  const err=$('err'); err.textContent="";
  try{
    const rgb=parseColor($('input').value);
    const hex=rgbToHex(rgb);
    $('hex').textContent=hex;
    $('rgb').textContent=formatRgb(rgb);
    $('hsl').textContent=formatHsl(rgb);
    $('preview').style.background=hex;
  }catch(e){
    err.textContent="✗ " + (e && e.message ? e.message : e);
    ['hex','rgb','hsl'].forEach(id=>$(id).textContent="—");
  }
}
document.querySelectorAll('[data-copy]').forEach(btn=>{
  btn.addEventListener("click", ()=>{
    const v=$(btn.dataset.copy).textContent;
    if(!v || v==="—") return;
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(v);
  });
});
$('input').addEventListener("input", render);
render();
</script>
</body>
</html>
