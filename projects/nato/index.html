<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NATO 音标字母 · small-tools-lab</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --border:#2a2f3a;
    --text:#e6e9ef; --muted:#9aa3b2; --accent:#4f9dff; --accent2:#7c5cff;
    --code:#0b0d12;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:28px 18px 60px}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--muted);margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px}
  label{display:block;color:var(--muted);margin:0 0 6px;font-size:12px;letter-spacing:.3px}
  textarea,input{width:100%;background:var(--code);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:10px 12px;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;resize:vertical}
  button{background:linear-gradient(135deg,var(--accent),var(--accent2));border:0;color:#fff;
    border-radius:8px;padding:9px 14px;font-size:13px;cursor:pointer;font-weight:600}
  button.ghost{background:var(--panel2);border:1px solid var(--border);color:var(--text)}
  button:active{transform:translateY(1px)}
  .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
  .out{margin-top:12px}
  .hint{color:var(--muted);font-size:12px;margin-top:8px}
  footer{color:var(--muted);font-size:12px;text-align:center;margin-top:30px}
  a{color:var(--accent)}
</style>
</head>
<body>
<div class="wrap">
  <h1>NATO 音标字母</h1>
  <p class="sub">文字 ⇄ NATO  phonetic（ICAO 字母表）— 零依赖，本地运行</p>

  <div class="card">
    <label>文本 → 音标</label>
    <textarea id="txt" rows="3" spellcheck="false">SOS call 911</textarea>
    <div class="btns">
      <button onclick="toPhonetic()">编码为音标</button>
      <button class="ghost" onclick="toText()">解码回文本</button>
    </div>
    <div class="out"><textarea id="phon" rows="3" placeholder="音标输出…"></textarea></div>
  </div>

  <div class="card">
    <label>音标 → 文本</label>
    <textarea id="phon2" rows="3" spellcheck="false" placeholder="Alfa Bravo Charlie …"></textarea>
    <div class="btns">
      <button onclick="toText2()">解码回文本</button>
      <button class="ghost" onclick="explain()">显示字母表</button>
    </div>
    <div class="out"><textarea id="txt2" rows="2" placeholder="文本输出…"></textarea></div>
    <div class="hint" id="tbl"></div>
  </div>

  <footer><a href="../index.html">← 返回工具箱</a> · small-tools-lab</footer>
</div>

<script src="src/nato.js"></script>
<script>
  var $=function(id){return document.getElementById(id);};
  function toPhonetic(){ $("phon").value = Nato.encode($("txt").value); }
  function toText(){
    var p = Nato.encode($("txt").value);
    $("phon").value = p; $("txt2").value = Nato.decode(p);
  }
  function toText2(){ $("txt2").value = Nato.decode($("phon2").value); }
  function explain(){
    var rows = Object.keys(Nato.CODE).map(function(k){
      return k + " = " + Nato.CODE[k];
    }).join("   ");
    $("tbl").textContent = rows;
  }
  toPhonetic();
</script>
</body>
</html>
