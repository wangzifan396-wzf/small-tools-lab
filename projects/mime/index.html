<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MIME 类型查询 · Small Tools Lab</title>
<style>
  :root { --bg:#f6f4f0;--panel:#fff;--ink:#2a2723;--muted:#8a8378;--line:#e7e2d9;--accent:#c2683f;--accent-soft:#f6e7df;--err:#c0392b;--shadow:0 8px 30px rgba(60,50,40,.10); }
  @media (prefers-color-scheme: dark){ :root{ --bg:#16140f;--panel:#211e18;--ink:#ece7df;--muted:#9b9384;--line:#322d25;--accent:#e08a5c;--accent-soft:#2f2620;--shadow:0 8px 30px rgba(0,0,0,.4);} }
  *{box-sizing:border-box;} body{margin:0;font:15px/1.6 -apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);padding:32px 16px;display:flex;justify-content:center;}
  .wrap{width:100%;max-width:720px;} header{margin-bottom:22px;} h1{font-size:26px;margin:0 0 6px;} h1 .ico{color:var(--accent);} .sub{color:var(--muted);margin:0;}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);margin-bottom:16px;}
  label{display:block;font-size:13px;color:var(--muted);margin-bottom:8px;font-weight:600;} input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;} input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent);}
  .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center;} .seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;} .seg button{border:0;background:transparent;color:var(--ink);padding:8px 14px;cursor:pointer;font:inherit;font-weight:600;border-right:1px solid var(--line);} .seg button:last-child{border-right:0;} .seg button.on{background:var(--accent);color:#fff;}
  button.act{border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:9px 16px;border-radius:10px;cursor:pointer;font:inherit;font-weight:600;transition:.15s;} button.act:hover{border-color:var(--accent);color:var(--accent);} button.primary{background:var(--accent);color:#fff;border-color:var(--accent);} button.primary:hover{filter:brightness(1.05);color:#fff;}
  .err{color:var(--err);font-size:13px;min-height:18px;margin-top:8px;} .meta{color:var(--muted);font-size:13px;} .meta b{color:var(--ink);}
  .out{white-space:pre-wrap;word-break:break-all;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:14px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-height:52px;}
  .tag{display:inline-block;background:var(--accent-soft);color:var(--accent);border-radius:999px;padding:2px 10px;font-size:12px;margin:3px 4px 0 0;}
</style>
</head>
<body>
<div class="wrap">
  <header><h1><span class="ico">🗂️</span> MIME 类型查询</h1><p class="sub">扩展名 ⇄ MIME 类型 · 零依赖 · 本地运行</p></header>
  <div class="card">
    <label for="in">输入（查类型：文件名或扩展名，如 <code>app.js</code> / <code>.png</code>；查扩展名：MIME 类型，如 <code>image/jpeg</code>）</label>
    <input id="in" placeholder="app.js" value="app.js" />
    <div class="row">
      <div class="seg" id="mode"><button data-m="type" class="on">查类型 →</button><button data-m="ext">← 查扩展名</button></div>
      <button class="act primary" id="go">查询</button>
      <button class="act" id="copy">复制结果</button>
    </div>
    <div class="err" id="err"></div>
  </div>
  <div class="card">
    <label>结果</label>
    <div class="out" id="out">—</div>
    <div class="row"><span id="tags" style="flex:1"></span></div>
  </div>
</div>
<script src="src/mime.js"></script>
<script>
  (function(){
    var M=window.MimeTool, inp=document.getElementById('in'), out=document.getElementById('out'), err=document.getElementById('err'), tags=document.getElementById('tags');
    var mode='type';
    document.getElementById('mode').addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;mode=b.getAttribute('data-m');Array.prototype.forEach.call(this.children,function(x){x.classList.toggle('on',x===b);});render();});
    function render(){
      err.textContent='';tags.innerHTML='';var v=inp.value.trim();
      if(!v){out.textContent='—';return;}
      if(mode==='type'){
        var t=M.lookup(v);
        if(!t){out.textContent='（未知类型）';err.textContent='内建表未收录该扩展名。';return;}
        var cs=M.charset(t);
        out.textContent=t+(cs?('  (charset: '+cs+')'):'');
        var exts=M.extensions(t);
        tags.innerHTML='同类型扩展名：'+(exts.length?exts.map(function(e){return '<span class="tag">.'+e+'</span>';}).join(''):'无');
      } else {
        var exts2=M.extensions(v);
        if(!exts2.length){out.textContent='（未知类型）';err.textContent='内建表未收录该 MIME 类型。';return;}
        out.textContent='.'+exts2.join('  .');
      }
    }
    document.getElementById('go').addEventListener('click',render);
    inp.addEventListener('input',render);
    document.getElementById('copy').addEventListener('click',function(){if(out.textContent&&out.textContent!=='—')navigator.clipboard&&navigator.clipboard.writeText(out.textContent);});
    render();
  })();
</script>
</body>
</html>
