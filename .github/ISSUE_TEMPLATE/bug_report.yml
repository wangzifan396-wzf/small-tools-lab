name: Bug report
description: Report a reproducible problem in one toolbox project
title: "[bug] "
labels: [bug]
body:
  - type: dropdown
    id: project
    attributes:
      label: Project
      description: Select the affected tool, or choose repository infrastructure.
      options:
        - Repository catalog or CI
        - Action Budget
        - ChromaCraft
        - Env Matrix
        - ForgeReady
        - Git Risk Map
        - HarnessLint
        - PatchBrief
        - README Studio
        - Schema Scout
        - TimeWeave
        - Local KB
        - Screenshot QA
        - Browser Todo
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the command or browser action, actual result, and expected result.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the smallest safe input or repository layout that reproduces the issue.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, Node.js 22, Chrome 128
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private source code, and personal data from this report.
          required: true
